   <h2 title="简介">落第骑士英雄谭10</h2>

   <div class="em">
      「我们是一个国家，更是一家人。」
   </div>

   <p>眼看向史黛菈家人提亲的日子逐渐逼近，一辉紧张万分。</p>

   <p>对方究竟愿不愿意认同他成为史黛菈的伴侣？</p>

   <p>惶恐不安的一辉终于抵达法米利昂机场。</p>

   <p>一辉一下飞机，便受到大批市民热烈迎接。</p>

   <p>温馨和谐的气氛让一辉放宽了心，但是－－这一切全都是错觉！？</p>

   <p>「黑铁一辉！法米利昂皇国国民在此正式要求与你决斗！」</p>

   <p>落第骑士VS.法米利昂皇国全国国民，一场无预警的大战即将展开！</p>

   <p>另一方面，一道似曾相识的邪恶阴影也在台面之下蠢蠢欲动！</p>

   <p><br/></p>

   <p>落第骑士英雄谭．全新篇章－－法米利昂皇国篇，正式开幕！</p>
