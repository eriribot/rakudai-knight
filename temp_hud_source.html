/* 通用小手机 · 状态栏 —— 分尺寸多主屏 + 原生式小组件编辑 */
#ph-statusbar-root{--t1:rgba(255,255,255,.92);--t2:rgba(255,255,255,.62);--t3:rgba(255,255,255,.4);--g:#d3ad63;--b:#6ea8e6;--gl:rgba(255,255,255,.05);--gb:rgba(255,255,255,.09);--bg:#0b0e14;--shell:#05070c;--rope-color:#7d6d4f;--rope-glow-filter:none;--ph-font-scale:1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
#ph-statusbar-root *{box-sizing:border-box;margin:0;padding:0}
#ph-statusbar-root button{font-family:inherit}

/* ---- 可收起、可在安全视口内自由悬浮的手机壳 ---- */
#ph-statusbar-root .ph-drawer{position:fixed;top:0;left:0;z-index:3004;width:330px;max-width:calc(100vw - 16px);background:var(--shell);border-radius:38px;padding:10px;border:.5px solid rgba(255,255,255,.1);box-shadow:0 0 0 2px #16181f,0 18px 50px rgba(0,0,0,.55);transform:translate3d(-200vw,-200vh,0);will-change:transform;user-select:none}
#ph-statusbar-root .ph-screen{position:relative;background-color:var(--bg);background-position:center;background-size:cover;background-repeat:no-repeat;border-radius:29px;overflow:hidden;clip-path:inset(0 round 29px);isolation:isolate;height:560px;display:flex;flex-direction:column;container-type:inline-size}
#ph-statusbar-root .ph-stat{cursor:grab;touch-action:none}
#ph-statusbar-root .ph-drawer.ph-dragging .ph-stat{cursor:grabbing}
#ph-statusbar-root [data-ph="floatgrab"]{cursor:move;touch-action:none;color:var(--g);padding:2px;border-radius:5px}

/* ---- 挂饰:verlet 分段绳(svg·纯色描边) + 末端吊牌(JS 定位) ---- */
#ph-statusbar-root .ph-charm{position:absolute;top:100%;right:30px;width:0;height:0;user-select:none;touch-action:none}
#ph-statusbar-root .ph-rope{position:absolute;left:-50px;top:0;overflow:visible;pointer-events:none;filter:var(--rope-glow-filter);transition:filter .18s ease}
#ph-statusbar-root .ph-rope polyline{stroke:var(--rope-color);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
#ph-statusbar-root .ph-charm-tag{position:absolute;top:0;left:0;width:30px;height:38px;border-radius:8px;background:linear-gradient(160deg,#171a22,#0d0f16);border:1px solid rgba(211,173,99,.55);display:flex;align-items:center;justify-content:center;color:var(--g);font-size:16px;font-size:calc(16px * var(--ph-font-scale));transform-origin:top center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));will-change:transform;cursor:grab;touch-action:none}
#ph-statusbar-root .ph-drawer.ph-dragging .ph-charm-tag{cursor:grabbing}
#ph-statusbar-root .ph-charm-bead{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#8a3b3b;box-shadow:0 0 5px rgba(178,90,90,.6)}
#ph-statusbar-root[data-ph-charm="seal"] .ph-charm-tag,#ph-statusbar-root[data-ph-charm="crystal"] .ph-charm-tag,#ph-statusbar-root[data-ph-charm="keycard"] .ph-charm-tag{width:30px}
#ph-statusbar-root[data-ph-charm="seal"] .ph-charm-tag>i,#ph-statusbar-root[data-ph-charm="crystal"] .ph-charm-tag>i,#ph-statusbar-root[data-ph-charm="keycard"] .ph-charm-tag>i{display:none}
