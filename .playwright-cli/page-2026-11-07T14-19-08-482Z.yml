              - listitem [ref=f6e1654]: 潜在事件2：塞拉斯暗中向阿勒坎特（艾涅丝妲）汇报清泉朝阳与试作武装的异常数据（概率80%，后续触发）。
            - paragraph [ref=f6e1655]: "***[NPC战斗思考]:"
