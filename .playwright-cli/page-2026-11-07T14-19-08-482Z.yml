              - listitem [ref=f6e1658]: 天雾绫斗：原本准备缩身硬接魔剑，见朝阳率先出手以不可思议的身法与无形力量截停魔剑并抛给自己，立即稳住下盘接住剑柄插入地面，平息残余热浪。
            - paragraph [ref=f6e1659]: "***[禁止扮演{{user}}]: 玩家本轮言行："
            - list [ref=f6e1660]:
              - listitem [ref=f6e1661]: 内心想法：觉得这种程度难怪当初很快就被亚伯拉罕部队收管了，认为星脉世代上限不如伐刀者；判断只用念力结合万应素再配合学姐（绫辻绚濑）那里的重心控制就行；看到雷士达同步率低，心想魔剑面对的不是星脉世代而是伐刀者；看到雷士达和速度快的场面想起了碎城雷与兔丸恋恋。
              - listitem [ref=f6e1662]: 动作：以念力结合万应素与绫辻一刀流重心控制接下《黑炉魔剑》，将魔人魔力注入剑身，令魔剑产生类似害怕的颤抖，监测数值直接飙升突破100；随后将魔剑随手丢给天雾绫斗，耸了耸肩。
              - listitem [ref=f6e1663]: 台词：对众人说自己是来送测试装备的，不是来抢装备的；询问那边的雷士达先生是否需要测试大教授这里刚好有的一把斩马刀；最后向克劳蒂雅提出之后的时间能否单独打扰一下，需要把这个月的返乡名额以及刚才的装备反应汇报一下，毕竟出现了那种情况身为交接员是需要了解的。
            - paragraph [ref=f6e1664]: "***[NPC交互意愿判定]:"
            - list [ref=f6e1665]:
              - listitem [ref=f6e1666]: 天雾绫斗：高度愿意交互。接住魔剑后对朝阳的身手与谦让表示惊讶与感谢。
              - listitem [ref=f6e1667]: 雷士达·马可菲尔：处于羞愤与动摇中。一方面因自己四次败给魔剑却被朝阳随手驯服而咬牙切齿，另一方面听到“大教授的斩马刀”时，渴望力量的本能让他无法干脆拒绝，粗声粗气地回应。
              - listitem [ref=f6e1668]: 克劳蒂雅·恩菲尔德：极度愿意交互。朝阳展现的神秘力量（突破100%的异常数值）以及主动提出的“单独汇报返乡名额与装备反应”正中她的下怀，她欣然应允并安排接下来的独处时间。
            - paragraph [ref=f6e1669]: "***[玩家侧走向]: 《黑炉魔剑》挟带灼热气浪从天花板死角急降而下。清泉朝阳并未慌乱，心中闪过对亚伯拉罕部队往事的思绪与对学姐绫辻绚濑剑术的回忆，脚下踩出绫辻一刀流精密的“折足”重心控制，同时释放念力结合周围万应素卸开下坠冲力，单手搭上《黑炉魔剑》的剑柄。当他体内的魔人级魔力灌入『万应精晶』的刹那，控制台上的适合率数值从25%附近瞬间狂飙突破100%的理论上限，发出刺耳警报，狂暴的魔剑如同遇到天敌般在朝阳手中剧烈颤抖哀鸣。朝阳随手将收敛了凶性的魔剑抛给身旁的天雾绫斗，绫斗顺势接住将其插进地面，测出97%的适合率。随后朝阳耸肩说出那番关于“送测试装备而非抢装备”、“询问雷士达是否测试大教授的斩马刀”以及“向克劳蒂雅申请单独汇报返乡名额与装备反应”的话语。雷士达在兰迪的搀扶下爬起身，面对朝阳的提议既羞恼又心动；克劳蒂雅则微笑着接下话头，在嘱咐装备局职员办理《黑炉魔剑》为期两三天的登记手续后，主动邀请朝阳前往学生会长室进行单独汇报。"
            - paragraph [ref=f6e1670]: "[时间推进]: 起始14:50 → 结束15:05 [正文字数要求]: 故事正文不少于4000字！！ [咩咩的自我鼓励]: 字数拉满！严格遵守与！不要让欧尼酱失望！"
            - paragraph [ref=f6e1671]: ☆‹天井の死角から垂直に落下してくる『黒炉の魔剣（セル＝ベレスタ）』が、大気を焼き焦がしながら白光の軌跡を描く。›从天花板的死角垂直落下的『黑炉魔剑』，一边灼烧着大气一边画出白光的轨迹。
            - paragraph [ref=f6e1672]: ☆‹床の特殊合金プレートが輻射熱だけで赤熱し、装備局の職員たちが悲鳴を上げてコンソールの下へ身を伏せた。› 地板的特殊合金板光凭辐射热就已经发红发热，装备局的职员们发出悲鸣趴到了控制台下面。
            - paragraph [ref=f6e1673]: ☆‹隣に立つ天霧綾斗が咄嗟に重心を落とし、素手で柄を掴み取ろうと右腕を構える。› 站在身旁的天雾绫斗在刹那间压低重心，架起右臂准备徒手去抓剑柄。
            - paragraph [ref=f6e1674]: ☆‹だが、あなたが動く方がそれよりも僅かに早かった。› 但是，你动作的速度比那还要稍微快上一线。
            - paragraph [ref=f6e1675]: ☆‹――この程度か。道理で当初、アブラハムの部隊にあっさりと回収・管理されたわけだ。› ——就这种程度吗。难怪当初，很快就被亚伯拉罕的部队收管了。
            - paragraph [ref=f6e1676]: ☆‹頭上から迫る灼熱の暴威を見上げながら、あなたの脳裏には冷ややかな評価がよぎる。› 仰望着从头顶逼近的灼热暴威，你的脑海里掠过冷静的评价。
            - paragraph [ref=f6e1677]: ☆‹結局のところ、星脈世代（ジェネステラ）という枠組みの上限は、魂そのものを器とする伐刀者（ブレイザー）には及ばない。› 归根结底，星脉世代这一框架的上限，比不上以灵魂本身作为容器的伐刀者。
            - paragraph [ref=f6e1678]: ☆‹これしきの暴走を鎮めるのに、大仰な構えすら必要なかった。› 要镇压这种程度的暴走，甚至连大摆架势都用不着。
            - paragraph [ref=f6e1679]: ☆‹念動力を周囲の万応素（マナ）に結合させ、そこに――かつて破軍学園で誰よりも慕っていた先輩、綾辻絢瀬から受け継いだ『綾辻一刀流』の重心制御を合わせるだけでいい。› 只要将念动力与周围的万应素结合，再配合上——过去在破军学园比任何人都要仰慕的学姐、从绫辻绚濑那里传承下来的『绫辻一刀流』的重心控制就行了。
            - paragraph [ref=f6e1680]: ☆‹「――っ！」› "——！"
            - paragraph [ref=f6e1681]: ☆‹足裏を床から浮かさず、氷の上を滑るように半歩だけ位置をずらす『折足（おりあし）』。› 脚底不离开地面，如同在冰面上滑行一般仅将位置挪开半步的『折足』。
            - paragraph [ref=f6e1682]: ☆‹あなたの身体は一切の力みの予兆を見せることなく、自然落下する重力そのものに同調して魔剣の直撃コースから紙一重で滑り出た。› 你的身体没有展露出丝毫发力的预兆，与自然落下的重力本身同步，以毫厘之差从魔剑的直击轨迹上滑开。
            - paragraph [ref=f6e1683]: ☆‹同時に、不可視の念動力が周囲の万応素を絡め取り、落下する『黒炉の魔剣』の側面へ絶妙な角度で触れ、その猛烈な運動エネルギーを外側へと受け流す。› 与此同时，不可视的念动力裹挟起周围的万应素，以绝妙的角度触碰下落的『黑炉魔剑』侧面，将其猛烈的动能向着外侧滑卸开去。
            - paragraph [ref=f6e1684]: ☆‹綾辻一刀流の極意、『受流（うけながし）』の応用。› 绫辻一刀流的精髓，『受流』的应用。
            - paragraph [ref=f6e1685]: ☆‹ゴォッ！ と熱波があなたの白髪を揺らして床を掠め、軌道を逸らされた魔剣の柄が、ちょうどあなたの目の前で一瞬だけ静止した。› 轰呼！热浪吹动你的白发掠过地板，被偏转了轨道的魔剑剑柄，刚好在你的眼前静止了一瞬间。
            - paragraph [ref=f6e1686]: ☆‹ステージ脇のモニターには、先ほどレスターが弾き飛ばされる直前に記録された『２５％』付近の適合率グラフが残像のように点滅している。› 舞台侧边的显示器上，刚才雷士达被弹飞前一刻所记录下的『25%』附近的适合率图表，正像残像一样闪烁着。
            - paragraph [ref=f6e1687]: ☆‹――同調率が２５％？ ずいぶんと低いな。だが生憎だ、今お前が直面しているのは星脈世代じゃない。伐刀者――それも、運命の檻を食い破った『魔人（デスペラード）』だ。› ——同步率25%？还真是低啊。但很可惜，现在你所面对的并不是星脉世代。而是伐刀者——而且，还是咬碎了命运囚笼的『魔人』。
            - paragraph [ref=f6e1688]: ☆‹あなたは無造作に右手を伸ばし、『黒炉の魔剣』の無骨な柄を鷲掴みにした。› 你随意地伸出右手，一把抓住了『黑炉魔剑』那粗犷的剑柄。
            - paragraph [ref=f6e1689]: ☆‹ジュワッ、と大気が焼ける音が鳴るよりも早く、あなたの掌から、この世界の万応素の法則とは根本的に異なる、底知れない深淵のような『魔力』が真紅の万応精晶へと直接流し込まれた。› 比空气被灼烧的滋滋声响起更快一步，从你的手掌之中，一股与这个世界的万应素法则截然不同、宛如无底深渊般的『魔力』，直接灌注进了真红的万应精晶之中。
            - paragraph [ref=f6e1690]: ☆‹キィィィンッ――！！› 铮——！！
            - paragraph [ref=f6e1691]: ☆‹保管庫全体に、ガラスがひび割れるような甲高い金属音が響き渡った。› 整个保管库里，回荡起如同玻璃碎裂般尖锐的金属音。
            - paragraph [ref=f6e1692]: ☆‹荒れ狂っていた純白の巨大刀身が、まるで天敵の喉元に噛みつかれた小動物のように、あなたの右手の中でガタガタと激しく震え始める。› 原本狂暴肆虐的纯白巨大刀身，简直就像被天敌咬住咽喉的小动物一样，在你的右手之中咔哒咔哒地剧烈颤抖起来。
            - paragraph [ref=f6e1693]: ☆‹それは拒絶の振動ではなく、圧倒的な上位存在の因果引力に押し潰されまいとする、恐怖の戦慄だった。› 那并不是排斥的震动，而是为了不被压倒性的上位存在的因果引力碾碎、所发出的恐惧战栗。
            - paragraph [ref=f6e1694]: ☆‹「な、なんだこれ……！？ 計測器の数値が……っ！」› "这、这是怎么回事……！？测量仪的数值……！"
            - paragraph [ref=f6e1695]: ☆‹コンソールの下から顔を上げた主任職員が、メインモニターを見て目を剥いた。› 从控制台底下抬起头的主任职员，看着主显示器瞪大了眼睛。
            - paragraph [ref=f6e1696]:
              - generic [ref=f6e1697]: ☆‹『適合率：４８％……７６％……９９％……１００％――ＥＲＲＯＲ（測定限界突破）！！』›
              - generic [ref=f6e1698]: 『适合率：48%……76%……99%……100%——ERROR（突破测定界限）！！』
            - paragraph [ref=f6e1699]: ☆‹ピピピピピッ！ と試作武装の変換センサーと保管庫のメインコンソールが同時にレッドゾーンの警告音を鳴らし、１００％の天井を突き抜けたゲージが真っ赤な文字化けを起こしてスパークを散らす。› 哔哔哔哔哔！试作武装的转换传感器与保管库的主控制台同时拉响了红区警报音，冲破100%天花板的计量条出现鲜红的乱码，迸散出电火花。
            - paragraph [ref=f6e1700]: ☆‹『黒炉の魔剣』が放っていた灼熱の業火は、あなたの掌から伝わる絶対的な支配力の前に、嘘のようにシュンと縮み上がった。› 『黑炉魔剑』原本释放出的灼热业火，在从你手掌传来的绝对支配力面前，像假的一样咻地一下萎缩了下去。
            - paragraph [ref=f6e1701]: ☆‹「……っ！？」› "……！？"
            - paragraph [ref=f6e1702]: ☆‹すぐ隣で構えていた綾斗が、信じられないものを見るように目を丸くして息を呑む。› 在紧邻身旁摆出架势的绫斗，像看到难以置信的事物一般瞪圆了眼睛倒吸一口凉气。
            - paragraph [ref=f6e1703]: ☆‹後方で双剣『パン＝ドラ』の柄に手をかけていたクローディアも、その紫色の瞳を大きく見開き、唇の端の笑みを一瞬だけ凍りつかせた。› 在后方把手搭在双剑『潘朵拉』剑柄上的克劳蒂雅，也大大地睁开了那双紫罗兰色的眼眸，嘴角的笑意凝固了一瞬。
            - paragraph [ref=f6e1704]: ☆‹あなたは掌の中で怯えるように細かく震えている『黒炉の魔剣』から、ふっと魔力の圧を抜いた。› 你从手掌中那把正害怕似地细微颤抖着的『黑炉魔剑』上，呼地一下撤去了魔力的压迫。
            - paragraph [ref=f6e1705]: ☆‹そして、すぐ横に立つ綾斗へと視線を向け、手首を軽く返してその巨大な柄を彼の方へと放り投げた。› 随后，你将视线转向站在紧邻身旁的绫斗，手腕轻轻一翻，把那巨大的剑柄朝他那边丢了过去。
            - paragraph [ref=f6e1706]: ☆‹「わっ……と！」› "哇……噢！"
            - paragraph [ref=f6e1707]: ☆‹綾斗は反射的に両手を伸ばし、放られた『黒炉の魔剣』の柄を空中でしっかりと受け止めた。› 绫斗条件反射地伸出双手，在半空中稳稳接住了被丢过来的『黑炉魔剑』的剑柄。
            - paragraph [ref=f6e1708]: ☆‹あなたがすでに暴走の核を完全に挫いていたため、魔剣は綾斗の手を焼くこともなく、彼の星辰力と滑らかに呼応する。› 由于你已经将暴走的核心彻底挫败，魔剑既没有灼烧绫斗的手，反而与他的星辰力顺畅地呼应起来。
            - paragraph [ref=f6e1709]: ☆‹綾斗はそのまま大剣の切っ先を床のプレートへと真っ直ぐに突き立てた。› 绫斗就这样将大剑的剑尖笔直地插进了地板的金属板中。
            - paragraph [ref=f6e1710]: ☆‹カァン、と澄んだ音が響き、純白の光刃が粒子となって静かに霧散していく。› 哐啷，清脆的声响回荡开来，纯白的光刃化作粒子安静地消散而去。
            - paragraph [ref=f6e1711]: ☆‹保管庫内に充満していた焦げるような熱気が、空調システムの稼働音とともに急速に引いていった。› 充斥在保管库内的灼人热气，伴随着空调系统的运转声迅速消退了下去。
            - paragraph [ref=f6e1712]: ☆‹「さ、再計測完了……！ 天霧綾斗様の適合率、９７パーセント！ 正常値で安定しています！」› "重、重新测量完毕……！天雾绫斗大人的适合率，百分之九十七！在正常值范围内保持稳定！"
            - paragraph [ref=f6e1713]: ☆‹職員の震える声がドーム内に響く。› 职员颤抖的声音在圆顶空间内回荡。
            - paragraph [ref=f6e1714]: ☆‹あなたは両手をポケットに突っ込み、軽く肩をすくめて見せた。› 你把双手插进兜里，轻轻耸了耸肩。
            - paragraph [ref=f6e1715]:
              - generic [ref=f6e1716]: ☆‹清泉朝陽:「僕はテスト装備を届けに来ただけで、装備を奪いに来たんじゃないからね」›
