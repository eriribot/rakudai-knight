                  - generic [ref=f20e11]: 【学战都市 Asterisk · 第一幕请求】 本次档案已写入 MVU 并成功回读，开局状态为已建档。 玩家：清泉朝阳 性别：男性 所属学园：雷渥夫黑学园 校内序列（本局开局设定）：未上榜 性格：闷骚，表面高冷但内心想法很多 处事风格：谋后而定 能力身份：自定义（见能力说明） 角色简介：白发黑瞳，忧郁俊朗因为大教授的实验而从普通的破军学生变成继承了暴君能力的魔人,受大教授的指示转学到了六花岛配合大教授的工作。以爱尔.爱兰兹为化名。 星辰力与运用：兼具落第世界观的魔人级别的魔力，通过超越A级精密的魔力控制以及实验得来的星脉世代的强化，基本上无上限。 武装类别：研究装备 武装名称：镜花水月,冰牙，噬血者 武装适合与使用条件：固有灵装与万应矿的融合，可以随后像召唤固有灵装一样召唤，但一般使用的是煌式武器。 能力与武装机理：镜花水月为初始固有灵装，因为大教授的实验有了冰牙和噬血者，且经过万应筐强化。 共通限制：结合伐刀者与星脉世代的能力，兼具镜花水月，暴君的精神控制,冰牙的绝对零度，以及会白月光最喜欢的学姐的绫辻一刀流 战斗风格：基本全能 能力／武装招式（名称｜说明｜条件与代价；所填项目均已掌握）： 五官催眠 精神控制 念力操控 瞬间移动 元素掌控 欺骗现实 绝对零度 其他技艺（所填项目均已掌握）： 绫辻一刀流 【本局已写入并回读的场景】 切入阶段：第五章 时间：西历 2013 年 6 月 14 日 地点：雷渥夫黑学园·校园入口 切入说明：熟悉学园与六花的生活 【玩家开场白】 午后的光线落在雷渥夫黑学园的校园入口。我确认了一遍终端上的地图，给跪舔大教授的恶辣之王交代事宜后，便将大教授安装数据测试的武器送往星导馆(该世界观大教授在因为收容空间震而来的六花岛实际权力凌驾于财团) 【规则边界】 每所学园各有 72 个在名序列名额，第 1–12 名列于第一页，称始页十二人；第 13–72 名同样在榜。序列仅表示所选学园的排名，不等同于通用战力，不能自动赋予获胜记录。 个人异能、星辰力运用、武装功能和独立技艺分别理解；原有 NPC 的武装、经历与关系不自动转移给玩家。 人物简介中的既往经历、当前身体状态、当前可用能力与本局映射分别理解。既往经历不自动授予当前巅峰能力，身体变化也不自动抹去经验或人格。当前能力以玩家确认的两类能力列表及限制为准；若背景与当前状态互相冲突，列出需要确认的具体冲突，不擅自替玩家裁定。跨世界术语仅按玩家明确填写的本局映射使用，不按名称相似度换算境界、魔力量或登记等级；映射是本局创作设定，不声称是原作官方设定。 请读取本局 MVU 的已建档状态与学战世界书，按已确认场景演绎第一幕；有玩家开场白时从末尾接续。不要重新初始化、添加落第评级或预写胜负与人际；只记录实际发生的剧情变化。
