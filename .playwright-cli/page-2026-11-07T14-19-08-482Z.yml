                  - generic [ref=f6e1723]: "\"我是来送测试装备的，不是来抢装备的呢\""
            - paragraph [ref=f6e1724]: ☆‹静まり返った保管庫の中で、あなたの落ち着いた声がよく通る。› 在恢复寂静的保管库中，你平静的声音清晰地传开。
            - paragraph [ref=f6e1725]: ☆‹あなたはそのまま視線を巡らせ、壁際でランディに肩を貸されながらよろよろと立ち上がったレスターの方を見た。› 你就这样转动视线，看向在墙边扶着兰迪的肩膀摇摇晃晃站起身来的雷士达。
            - paragraph [ref=f6e1726]: ☆‹二メートル近い巨躯を誇り、力任せの豪快な一撃を信条とするレスターと、先ほど天井を駆け上がった魔剣の軌跡。› 拥有接近两公尺的庞大身躯、信奉以蛮力打出豪迈一击的雷士达，以及刚才冲上天花板的魔剑轨迹。
            - paragraph [ref=f6e1727]: ☆‹その光景はあなたの胸の奥に、かつて破軍学園で目にした生徒会書記――巨大な斬馬刀を振るう『破城艦』砕城雷と、その周りを超音速で跳ね回っていた小柄な少女、兎丸恋々の姿をふと思い起こさせた。› 那副光景在你的心底，冷不防唤醒了过去在破军学园见过的学生会书记——挥舞巨大斩马刀的『破城舰』碎城雷，以及在他周围以超音速蹦跳飞驰的娇小少女、兔丸恋恋的身影。
            - paragraph [ref=f6e1728]: ☆‹あなたはコンソールの上に置かれた銀灰色のアタッシュケースに指先を添え、煤けた顔のレスターに向かって言葉を続けた。› 你将指尖搭在放在控制台上的银灰色手提箱上，朝着一脸煤灰的雷士达继续说道。
            - paragraph [ref=f6e1729]:
              - generic [ref=f6e1730]: ☆‹清泉朝陽:「ちょうど大教授のところに斬馬刀が振りあるんだけど、そこのレスターさんはテストしてみるかい？」›
              - generic [ref=f6e1732]:
                - generic [ref=f6e1734]: 清
                - generic [ref=f6e1735]:
                  - generic [ref=f6e1736]: 清泉朝阳
                  - generic [ref=f6e1737]: "\"刚好大教授那里有一把斩马刀，那边的雷士达先生需要测试一下吗？\""
            - paragraph [ref=f6e1738]: ☆‹最後に、あなたはゆっくりと歩み寄ってきたクローディアへと向き直った。› 最后，你转过身面向缓步走过来的克劳蒂雅。
            - paragraph [ref=f6e1739]:
              - generic [ref=f6e1740]: ☆‹清泉朝陽:「それとクローディアさん、この後の時間、少し個別に邪魔してもいいかな。今月の帰郷枠の件と、さっきの装備の反応について報告しておきたいんだ。ああいう状況が起きた以上、引き継ぎ担当としては把握しておく必要があるからね」›
              - generic [ref=f6e1742]:
                - generic [ref=f6e1744]: 清
                - generic [ref=f6e1745]:
                  - generic [ref=f6e1746]: 清泉朝阳
                  - generic [ref=f6e1747]: "\"那么克劳蒂雅小姐，之后的时间能单独打扰你一下吗。后面需要把这个月的返乡名额以及刚才的装备反应汇报一下，毕竟出现了那种情况，身为交接员是需要了解的呢\""
            - paragraph [ref=f6e1748]: ☆‹あなたの言葉が落ちると、保管庫の空気は三者三様の反応で揺れ動いた。› 当你的话音落下，保管库里的空气因为三方截然不同的反应而波动起来。
            - paragraph [ref=f6e1749]: ☆‹「くっ……！ てめえ、俺をコケにしてんのか……！」› "唔……！你这家伙，是在羞辱老子吗……！"
            - paragraph [ref=f6e1750]: ☆‹壁際のレスターが、黒焦げになった制服の胸元を握りしめ、悔しさに歯ぎしりしながらあなたを睨みつけた。› 墙边的雷士达死死攥着变得焦黑的制服胸口，不甘心地咬牙切齿瞪着你。
            - paragraph [ref=f6e1751]: ☆‹自分が四度も挑んで弾き飛ばされた『黒炉の魔剣』を、目の前の白髪の少年は片手で赤子の手をひねるように黙らせ、あまつさえ「奪いに来たんじゃない」と転入生の綾斗へ無造作に放り投げたのだ。› 自己挑战了四次都被弹飞的『黑炉魔剑』，眼前的白发少年单手就像拧婴儿的手臂一样让它闭了嘴，甚至还说着"不是来抢的"随手丢给了转学生绫斗。
            - paragraph [ref=f6e1752]: ☆‹プライドの高いレスターにとって、それは腸が煮えくり返るような屈辱だった。› 对于自尊心极强的雷士达来说，那是让他肚肠都快气炸了的屈辱。
            - paragraph [ref=f6e1753]: ☆‹「そ、そうですよレスターさん！ こんなレヴォルフの奴の言うことなんか……」› "就、就是说啊雷士达大哥！这种雷渥夫的家伙说的话根本……"
            - paragraph [ref=f6e1754]:
              - text: ☆‹脇から口を挟もうとしたランディを、レスターは「黙ってろ、ランディ！」と片手で荒々しく制した。›
              - generic [ref=f6e1755]: 雷士达用单手粗暴地喝止了打算从旁插嘴的兰迪："给我闭嘴，兰迪！"。
            - paragraph [ref=f6e1757]: ☆‹レスターの鋭い眼光が、あなたの指先が触れている銀灰色のアタッシュケースへと向けられる。› 雷士达锐利的目光，投向了你指尖所触碰着的银灰色手提箱。
            - paragraph [ref=f6e1758]: ☆‹『大教授』――統合企業財団すら頭を垂れる怪物が作り上げた、斬馬刀型の試作武装。› 『大教授』——连统合企业财团都要低头的怪物所打造出来的，斩马刀型试作武装。
            - paragraph [ref=f6e1759]: ☆‹ユリスに三連敗し、公式戦の指名権も使い果たし、『黒炉の魔剣』にも拒絶された今のレスターにとって、自分の剛力を十全に発揮できる重武装の誘惑は、プライドだけで切り捨てられるものではなかった。› 对于输给尤莉丝三连败、用光了公式战指定挑战权、又被『黑炉魔剑』拒绝的现在的雷士达而言，能够充分发挥自身刚力的重型武装的诱惑，并不是光凭自尊心就能一刀切舍掉的东西。
            - paragraph [ref=f6e1760]: ☆‹「……チッ。施しを受けるつもりはねえ。だが、『テスト』に付き合ってやるっていうんなら、話は別だ」› "……啧。老子可没打算接受施舍。不过，如果是说陪你们做『测试』的话，那就另当别论了"
            - paragraph [ref=f6e1761]: ☆‹レスターは顔を背け、吐き捨てるような低い声で言った。› 雷士达别过脸去，用像是啐了一口似的低沉声音说道。
            - paragraph [ref=f6e1762]:
              - generic [ref=f6e1763]: ☆‹レスター・マクフェイル:「その斬馬刀とやらが俺の力に耐えられる代物かどうか、後でデータ計測に付き合ってやる。連絡は生徒会を通せ……行くぞ、ランディ、サイラス！」›
            - generic [ref=f6e1767]:
              - generic [ref=f6e1768]: 雷士达·马可菲尔
              - generic [ref=f6e1769]: "\"那把什么斩马刀到底是不是能承受住老子力量的货色，之后老子就陪你做个数据测量。联络就通过学生会吧……走了，兰迪、塞拉斯！\""
            - paragraph [ref=f6e1770]: ☆‹レスターは肩を怒らせたまま踵を返し、足音荒くエレベーターの方へと歩き去っていく。› 雷士达耸着肩膀转过身，脚步粗重地朝着电梯方向大步离去。
            - paragraph [ref=f6e1771]: ☆‹ランディが慌ててその後を追いかけ、最後に残った痩せぎすのサイラスが、眼鏡の奥の冷たい瞳であなたの横顔とコンソールのエラー表示をちらりと一瞥してから、無言で頭を下げて去っていった。› 兰迪慌慌张张地追在后面，最后留下的瘦削的塞拉斯，用眼镜片后冰冷的眼瞳瞥了一眼你的侧脸与控制台的错误显示，随后一言不发地低下头离开了。
            - paragraph [ref=f6e1772]: ☆‹一方、ステージの上で起動を停止した『黒炉の魔剣』の柄を握りしめていた天霧綾斗は、自分の掌とあなたの顔を交互に見て、少し呆気にとられたように瞬きをした。› 另一方面，在舞台上紧握着停止启动的『黑炉魔剑』剑柄的天雾绫斗，交替看了看自己的手掌和你的脸，有些发愣地眨了眨眼。
            - paragraph [ref=f6e1773]:
              - generic [ref=f6e1774]: ☆‹天霧綾斗:「あ、ありがとう、エル君。今の……すごい体捌きと力の受け流しだったね。それに、この剣の暴走を一瞬で抑え込んでしまうなんて」›
            - generic [ref=f6e1778]:
              - generic [ref=f6e1779]: 天雾绫斗
              - generic [ref=f6e1780]: "\"谢、谢谢你，爱尔君。刚才那一下……真是厉害的身法与卸力技巧呢。而且，居然能在一瞬间就把这把剑的暴走给压制住\""
            - paragraph [ref=f6e1781]: ☆‹綾斗は幼少期から古流武術『天霧辰明流』を修めてきた武術家だ。› 绫斗是从幼年起便修习古流武术『天雾辰明流』的武术家。
            - paragraph [ref=f6e1782]: ☆‹だからこそ、あなたが魔剣を受け止める直前に見せた『折足』の歩法と『受流』の重心移動が、単なる異能の力押しではなく、極限まで研ぎ澄まされた剣術の理合に基づいていることを肌で感じ取っていた。› 正因如此，他亲身感受到了你在接下魔剑前一刻所展现的『折足』步法与『受流』重心移动，并非单纯依靠异能强推，而是建立在锤炼至极限的剑术事理之上。
            - paragraph [ref=f6e1783]: ☆‹しかも、あなたがあらかじめ魔剣の荒ぶる意識を完全に屈服させてからパスしたおかげで、綾斗の右手には火傷ひとつ残っていなかった。› 而且，多亏你预先将魔剑狂暴的意识完全屈服之后再抛给他，绫斗的右手上甚至连一点烧伤都没有留下。
            - paragraph [ref=f6e1784]: ☆‹「天霧様、その『黒炉の魔剣』ですが、正式な貸出登録の手続きと安全検査に二、三日ほどお時間をいただきます。完了次第、生徒会を通じてお渡しいたしますので、一旦こちらへお預けください」› "天雾大人，关于那把『黑炉魔剑』，正式的借出登记手续与安全检查需要花费两三天左右的时间。一旦办理完毕，就会通过学生会交到您手上，现在请先暂存于我们这里吧"
            - paragraph [ref=f6e1785]: ☆‹主任職員が恐る恐るステージへ近づき、綾斗から『黒炉の魔剣』を受け取って再びケースへと収納した。› 主任职员战战兢兢地走近舞台，从绫斗手中接过『黑炉魔剑』，再次收纳进箱子里。
            - paragraph [ref=f6e1786]: ☆‹綾斗は名残惜しそうにその真紅の結晶を見つめていたが、すぐに「よろしくお願いします」と礼儀正しく頭を下げた。› 绫斗虽然依依不舍地注视着那枚真红的结晶，但很快便礼貌地低头说了声"麻烦你们了"。
            - paragraph [ref=f6e1787]: ☆‹そして、あなたのすぐ目の前では。› 紧接着，就在你的正前方。
            - paragraph [ref=f6e1788]: ☆‹ふわりと甘い花の香りを漂わせながら、クローディア・エンフィールドが一歩踏み出し、あなたとの距離を詰めた。› 克劳蒂雅·恩菲尔德身上飘散着甜美的花香，迈出一步，拉近了与你之间的距离。
            - paragraph [ref=f6e1789]: ☆‹彼女はコンソールからケーブルを外して銀灰色のアタッシュケースに収納された試作武装と、いまだに『ＥＲＲＯＲ』のログを残しているメインモニターを交互に見比べ、それからあなたの黒い瞳を真っ直ぐに見つめた。› 她交替对比着从控制台拔下数据线收纳进银灰色手提箱的试作武装，以及依然残留着『ERROR』日志的主显示器，随后笔直地注视着你的黑色眼瞳。
            - paragraph [ref=f6e1790]:
              - generic [ref=f6e1791]: ☆‹クローディア・エンフィールド:「ええ、もちろんですわ、エルさん。これほど興味深い『反応』を見せられてしまっては、学園の生徒会長としても、お話を伺わないわけにはまいりませんもの」›
            - generic [ref=f6e1795]:
              - generic [ref=f6e1796]: 克劳蒂雅·恩菲尔德
              - generic [ref=f6e1797]: "\"是，那是当然的呢，爱尔先生。既然都让我看到了如此令人感兴趣的『反应』，身为学园的学生会长，也不可能不听听您的汇报呢\""
            - paragraph [ref=f6e1798]: ☆‹クローディアは胸元で優雅に指を組むと、すぐ後ろに立っていた主任職員へと視線を向けた。› 克劳蒂雅在胸前优雅地交叠手指，将视线投向站在紧后方的主任职员。
            - paragraph [ref=f6e1799]: ☆‹声のトーンは普段通り穏やかで柔らかいが、そこには一切の反論を許さない『赤蓮』総代表としての絶対的な威厳が滲んでいた。› 声音的语调虽然如平时一般温和柔软，但其中却透出不容许丝毫反驳的、作为『赤莲』总代表的绝对威严。
            - paragraph [ref=f6e1800]:
              - generic [ref=f6e1801]: ☆‹クローディア・エンフィールド:「主任、先ほどの計測で発生した異常数値のログは、すべて私の直轄端末へ転送した上で、ここのサーバーからは完全に消去しておいてくださいね。大教授の研究機密に関わるデータですから、外部に漏れればどうなるか……お分かりですわね？」›
            - generic [ref=f6e1805]:
              - generic [ref=f6e1806]: 克劳蒂雅·恩菲尔德
              - generic [ref=f6e1807]: "\"主任，刚才的测量中所产生的异常数值日志，请全部转发到我的直辖终端上，并从这里的服务器里彻底删除掉呢。因为这是关系到大教授研究机密的数据，要是泄露到外部会变成什么样……您应该明白的吧？\""
            - paragraph [ref=f6e1808]: ☆‹「は、はいっ！ ただちに処理いたします、生徒会長！」› "是、是的！我立刻处理，学生会长！"
            - paragraph [ref=f6e1809]: ☆‹主任職員が顔色を失って敬礼し、大慌てでデータの転送と消去作業に取り掛かる。› 主任职员脸色发白地行了个礼，手忙脚乱地开始进行数据的转发与删除作业。
            - paragraph [ref=f6e1810]: ☆‹１００％突破という規格外の記録をその場で封殺したクローディアは、何事もなかったかのように微笑み、隣に立つ綾斗へと振り返った。› 当场封杀了突破100%这一超规格记录的克劳蒂雅，若无其事地微笑着，转头看向站在身旁的绫斗。
            - paragraph [ref=f6e1811]:
              - generic [ref=f6e1812]: ☆‹クローディア・エンフィールド:「綾斗さん、本日はここまでにしておきましょう。『黒炉の魔剣』の登録手続きが終わりましたら、改めて私からご連絡いたしますわ。実はあなたにも、後ほど個人的にお話ししたいことがございますのよ」›
            - generic [ref=f6e1816]:
              - generic [ref=f6e1817]: 克劳蒂雅·恩菲尔德
              - generic [ref=f6e1818]: "\"绫斗同学，今天就先到这里吧。等『黑炉魔剑』的登记手续办完之后，我会再另行联系您的。其实我稍后，也有一些私人的事情想要和您谈谈呢\""
            - paragraph [ref=f6e1819]:
              - generic [ref=f6e1820]: ☆‹天霧綾斗:「え？ 僕に、ですか？ わかりました。じゃあ、僕は先に寮へ戻っていますね。またね、エル君」›
            - generic [ref=f6e1824]:
              - generic [ref=f6e1825]: 天雾绫斗
              - generic [ref=f6e1826]: "\"咦？找我吗？我明白了。那么，我就先回宿舍去了呢。再见啦，爱尔君\""
            - paragraph [ref=f6e1827]: ☆‹綾斗はあなたに向かって親しげに手を振ると、先に地上へ戻る別の小型エレベーターへと向かっていった。› 绫斗朝你亲切地挥了挥手，便走向了先返回地面的另一台小型电梯。
            - paragraph [ref=f6e1828]: ☆‹綾斗の姿が見えなくなると、クローディアは再びあなたの方へと身体を向けた。› 等绫斗的身影消失不见后，克劳蒂雅再次将身体转向你这边。
            - paragraph [ref=f6e1829]: ☆‹二人きりになった専用エレベーターへとあなたを促し、扉が閉まって上昇を始めると、密室の中に彼女の甘い香水の匂いが濃密に立ち込める。› 她示意你走进只剩你们两人的专用电梯，当电梯门合拢开始上升时，密闭的空间里浓郁地弥漫开她甜美的香水味。
            - paragraph [ref=f6e1830]: ☆‹クローディアはエレベーターの壁に軽く背を預け、豊かな胸元のラインを強調するように腕を組みながら、紫色の瞳であなたをじっと見上げた。› 克劳蒂雅轻轻将后背靠在电梯墙壁上，像是强调丰满的胸口线条一般抱起双臂，用紫罗兰色的眼眸一眨不眨地仰望着你。
            - paragraph [ref=f6e1831]:
              - generic [ref=f6e1832]: ☆‹クローディア・エンフィールド:「ふふ、それにしても驚きましたわ。『黒炉の魔剣』がまるで怯えた子供のように震えるなんて……あなたが流し込んだあの力、少なくとも私たちが知る万応素（マナ）や星辰力とは、まったく異質のものですわね？」›
            - generic [ref=f6e1836]:
              - generic [ref=f6e1837]: 克劳蒂雅·恩菲尔德
              - generic [ref=f6e1838]: "\"呵呵，话虽如此还真是让我吃了一惊呢。『黑炉魔剑』居然会像受惊的孩子一样发抖……您灌注进去的那股力量，至少和我们所熟知的万应素或星辰力，是完全不同性质的东西吧？\""
            - paragraph [ref=f6e1839]: ☆‹彼女は唇に人差し指を当て、悪戯っぽく目を細めた。› 她将食指抵在嘴唇上，恶作剧般地眯起眼睛。
            - paragraph [ref=f6e1840]:
              - generic [ref=f6e1841]: ☆‹クローディア・エンフィールド:「それに、レスターさんに持ちかけた『斬馬刀』のお話も……随分と手回しがよろしいことですこと。これから私の生徒会長室へ向かいますが、あなたが仰っていた『今月の帰郷枠』と『装備の反応』について、どこまで私の耳に入れてくださるのかしら、エル・アーランズさん？」›
            - generic [ref=f6e1845]:
              - generic [ref=f6e1846]: 克劳蒂雅·恩菲尔德
              - generic [ref=f6e1847]: "\"而且，您向雷士达同学提出的关于『斩马刀』的话题……准备得还真是周全呢。接下来我们要前往我的学生会长室，关于您刚才提到的『这个月的返乡名额』与『装备的反应』，不知道您打算透露多少给我听呢，爱尔·爱兰兹先生？\""
            - paragraph
            - paragraph [ref=f6e1848]: "【2013年6月14日/15:05】[玩家侧]: 【六花·星导馆学园·地下纯星煌式武装保管库→专用电梯】面对从天花板死角急降暴走的《黑炉魔剑》，清泉朝阳（化名爱尔·爱兰兹）比天雾绫斗更快出手，运用念力结合万应素以及从破军学园学姐绫辻绚濑处学来的『绫辻一刀流』折足与受流重心控制卸开魔剑冲力，单手抓住剑柄并将魔人级别的魔力灌注其中。魔剑核心的万应精晶因感受到上位魔人的因果引力而剧烈战栗臣服，控制台与试作武装传感器的适合率数值瞬间突破100%上限并报错。朝阳撤去魔力压迫后将魔剑随手抛给身旁的天雾绫斗，绫斗接住剑柄插入地面平息热浪，测出97%适合率（因此免于原著的右手烧伤，魔剑交由装备局职员收回办理为期两三天的登记手续）。朝阳耸肩表示自己只是来送测试装备而非抢装备，并想起破军学园的碎城雷与兔丸恋恋，主动询问墙边的雷士达是否要测试大教授那里的一把斩马刀。雷士达虽因自尊受挫而羞恼，但在重型武装的诱惑下并未拒绝，丢下一句“之后陪你测数据，通过学生会联络”后带兰迪与塞拉斯离去。随后朝阳向克劳蒂雅提出稍后单独汇报“本月的返乡名额”与“刚才的装备反应”。克劳蒂雅当即命令主任职员将100%突破的异常数据转发至她的直辖终端并彻底删除本地记录，随后支开绫斗（约定稍后另行找绫斗私谈），带着朝阳进入专用电梯前往学生会长室，并在电梯内主动试探朝阳刚才展现的异质力量（魔力）以及他准备汇报的具体内容。[平行线]: 无[NPC认知变化]:"
