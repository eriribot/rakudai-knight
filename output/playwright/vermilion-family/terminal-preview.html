:root {
  color-scheme: dark;
  --font-ui: "SF Pro Display", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Yu Gothic UI", "Noto Sans CJK SC", sans-serif;
  --font-num: "SF Pro Text", "Segoe UI", Roboto, tabular-nums;
  --surface: #111520;
  --screen: #0a0d14;
  --card: #161c2b;
  --card2: #1e2638;
  --ink: #f8fafc;
  --ink2: #cbd5e1;
  --muted: #718096;
  --hair: rgba(255, 255, 255, 0.09);
  --ring: rgba(239, 68, 68, 0.35);
  --crimson: #ef4444;
  --crimson-glow: rgba(239, 68, 68, 0.45);
  --hagun-gold: #f59e0b;
  --lime: #10b981;
  --sky: #38bdf8;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.3);
  --press: rgba(255, 255, 255, 0.06);
}

:root[data-rk-theme="light"] {
  color-scheme: light;
  --surface: #f8fafc;
  --screen: #f1f5f9;
  --card: #ffffff;
  --card2: #e2e8f0;
  --ink: #0f172a;
  --ink2: #334155;
  --muted: #64748b;
  --hair: rgba(0, 0, 0, 0.08);
  --ring: rgba(239, 68, 68, 0.3);
  --crimson: #dc2626;
  --crimson-glow: rgba(220, 38, 38, 0.25);
  --hagun-gold: #d97706;
  --lime: #059669;
  --sky: #0284c7;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
  --press: rgba(0, 0, 0, 0.04);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background: var(--screen);
  color: var(--ink);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
}

.num { font-family: var(--font-num); }
button {
  font-family: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  padding: 0;
}

/* 顶栏状态栏 (Hagun Status) */
#sys {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px 6px;
  font-size: 11px;
  color: var(--ink2);
  flex: none;
  background: rgba(10, 13, 20, 0.95);
  border-bottom: 1px solid var(--hair);
  position: relative;
  z-index: 10;
}
#sys .sys-brand {
  font-weight: 800;
  font-size: 10.5px;
  letter-spacing: 0.5px;
  color: var(--crimson);
  display: flex;
  align-items: center;
  gap: 4px;
}
#sys .sys-brand::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--crimson);
  box-shadow: 0 0 8px var(--crimson);
}
#sys .sys-clk {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin-left: auto;
}
#sys .sys-icons {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}

/* 视口堆叠 */
#stack {
  flex: 1;
  position: relative;
  overflow: hidden;
}
.scr {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--screen);
  transform: translateX(100%);
  transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
  pointer-events: none;
  visibility: hidden;
}
.scr.on {
  transform: none;
  pointer-events: auto;
  visibility: visible;
}
.scr.under {
  transform: translateX(-20%);
  opacity: 0.7;
  pointer-events: none;
  visibility: visible;
}
#scr-home { transform: none; pointer-events: auto; visibility: visible; }

.apphead {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  flex: none;
  background: var(--surface);
  border-bottom: 1px solid var(--hair);
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  z-index: 5;
}
.apphead .back {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--ink2);
  border-radius: 8px;
}
.apphead .back:hover { background: var(--press); }
.apphead .t {
  font-weight: 700;
  font-size: 15px;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.apphead .sub {
  font-size: 11px;
  color: var(--muted);
  margin-left: 4px;
}
.apphead .act {
  margin-left: auto;
  font-size: 12.5px;
  color: var(--ink2);
}

.body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  padding-bottom: 12px;
}

/* 底部 Homebar 导航 */
#homebar {
  flex: none;
  display: flex;
  justify-content: center;
  align-items: center;

}

/* 浮窗小提醒 (Toast) */
#toast {
  position: fixed;

  transform: translateX(-50%);

  border: 1px solid var(--crimson);

  font-size: 12px;
  font-weight: 600;
  padding: 8px 18px;
  border-radius: 20px;

  z-index: 100;

  text-align: center;
}
#toast.on { opacity: 1; }


/* 设置页内的副 API 详情；全局通知样式在宿主 styles.css。 */
.rk-correction-progress {
  display: grid;
  grid-template-columns: 12px minmax(0, 1fr) auto;
  align-items: start;
  gap: 8px;
  min-width: 0;
  padding: 9px 10px;
  background: var(--surface);
  color: var(--ink);
  font: 11px/1.5 var(--font-ui);
}
.rk-correction .rk-correction-progress[data-auto-status] { margin: 10px 0; padding: 10px; border: 1px solid var(--hair); }
.rk-correction-progress .rk-progress-copy { min-width: 0; overflow-wrap: anywhere; }
.rk-correction-progress [data-progress-stage] { display: block; font-weight: 700; letter-spacing: .3px; }
.rk-correction-progress [data-progress-message] { color: var(--ink2); margin: 2px 0 0; font-size: 11px; line-height: 1.5; }
.rk-correction-progress [data-progress-attempt] { display: block; color: var(--muted); font: 10px/1.5 var(--font-num); }
.rk-correction-progress .rk-progress-glyph {
  display: block;
  width: 9px;
  height: 9px;
  margin-top: 4px;
  box-sizing: border-box;
  border: 1px solid currentColor;
}
.rk-correction-progress[data-active='true'] .rk-progress-glyph {
  border-width: 2px;
  border-right-color: transparent;
  animation: rk-correction-turn 1.1s steps(4, end) infinite;
}
.rk-correction-progress[data-state='applied'] .rk-progress-glyph,
.rk-correction-progress[data-state='unchanged'] .rk-progress-glyph { background: currentColor; }
.rk-correction-progress[data-state='failed'] .rk-progress-glyph { border: 0; width: auto; height: auto; margin-top: 0; font-weight: 900; font-size: 15px; }
.rk-correction-progress[data-state='failed'] .rk-progress-glyph::before { content: '!'; }
.rk-correction-progress .rk-progress-actions { display: flex; gap: 5px; flex-wrap: wrap; justify-content: end; max-width: 128px; }
.rk-correction-progress .rk-progress-actions button {
  min-height: 32px;
  padding: 4px 7px;
  border: 1px solid var(--hair);
  border-radius: 0;
  background: var(--card2);
  color: var(--ink);
  font: 11px/1.5 var(--font-ui);
  cursor: pointer;
  touch-action: manipulation;
}
.rk-correction-progress .rk-progress-actions button:disabled { opacity: .45; cursor: default; }
.rk-correction-progress .rk-progress-actions button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.rk-correction-progress [hidden] { display: none !important; }
@keyframes rk-correction-turn { to { transform: rotate(360deg); } }
@media (max-width: 360px) {
  .rk-correction-progress { gap: 6px; padding: 8px; }
  .rk-correction-progress .rk-progress-actions { max-width: 66px; }
  .rk-correction-progress .rk-progress-actions button { width: 100%; min-height: 36px; }
}
@media (prefers-reduced-motion: reduce) {
  .rk-correction-progress[data-active='true'] .rk-progress-glyph { animation: none; border-right-color: currentColor; }
}

/* 选拔赛使用现有黑白终端色板；表单在窄屏自动换行。 */
.rk-t-panel, .rk-t-form { min-width: 0; overflow-wrap: anywhere; }
.rk-t-actions { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0; }
.rk-t-panel button, .rk-t-form button { border: 1px solid var(--hair); border-radius: 0; padding: 7px 10px; min-height: 36px; color: var(--ink); background: var(--card2); font: inherit; cursor: pointer; }
.rk-t-panel button:hover, .rk-t-form button:hover { border-color: var(--ink); }
.rk-t-panel button:disabled, .rk-t-form button:disabled { opacity: .5; cursor: default; }
.rk-t-form fieldset { border: 0; min-width: 0; margin: 0; padding: 0; }
.rk-t-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; }
.rk-t-field { display: grid; gap: 5px; min-width: 0; margin: 9px 0; font-size: 12px; }
.rk-t-field input, .rk-t-field select, .rk-t-field textarea { width: 100%; min-width: 0; box-sizing: border-box; padding: 8px; color: var(--ink); background: var(--card2); border: 1px solid var(--hair); border-radius: 0; font: inherit; }
.rk-t-field textarea { resize: vertical; }
.rk-t-panel :is(button, summary):focus-visible, .rk-t-form :is(input, select, textarea, button, summary):focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.rk-t-message { border-left: 3px solid var(--ink); padding: 7px 9px; background: var(--card2); }
.rk-t-match { padding: 12px 0; border-bottom: 1px solid var(--hair); }
.rk-t-match:last-child { border-bottom: 0; }
.rk-t-match-head { display: flex; align-items: baseline; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 11px; }
.rk-t-pair { font-weight: 700; line-height: 1.6; margin: 8px 0; }
.rk-t-pair span { font-weight: 400; color: var(--muted); }
.rk-t-table-wrap { width: 100%; overflow-x: auto; }
.rk-t-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
.rk-t-table :is(th, td) { padding: 9px 6px; border-bottom: 1px solid var(--hair); vertical-align: top; overflow-wrap: anywhere; }
.rk-t-table small { display: block; color: var(--muted); font-weight: 400; margin-top: 4px; }

/* 玩家照片共用图片加载回退；设置表单独立刷新，不重建其他配置输入。 */
.rk-player-avatar { position: relative; display: block; width: 100%; height: 100%; overflow: hidden; }
.rk-player-avatar .rk-avatar-initial { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.rk-player-avatar .rk-avatar-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.rk-player-avatar.rk-avatar-ready .rk-avatar-initial { display: none; }
.rk-player-avatar.rk-avatar-failed .rk-avatar-image { display: none; }
.rk-player-avatar.rk-avatar-failed .rk-avatar-initial { display: flex; }

/* ===== GBA 学园校历样式 ===== */
.gba-cal-panel{background:var(--card);border:1px solid var(--ink);margin:12px;padding:10px;box-shadow:3px 3px 0 var(--hair)}
.gba-cal-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--hair);margin-bottom:8px}
.gba-cal-cur-title{font:700 13px var(--font-title);letter-spacing:1px;color:var(--ink)}
.gba-cal-nav .gba-btn-sm{font:11px var(--font-ui);padding:3px 8px;background:var(--card2);color:var(--ink);border:1px solid var(--hair);cursor:pointer;border-radius:0}
.gba-cal-nav .gba-btn-sm:hover{background:var(--ink);color:var(--screen)}
.gba-cal-nav .gba-btn-jump{border-color:var(--ink);font-weight:600}
.gba-cal-week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font:700 11px var(--font-num);margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid var(--hair)}
.gba-cal-wh{color:var(--ink);padding:2px 0}
.gba-cal-wh.sun{color:var(--ink);font-weight:800}
.gba-cal-wh.sat{color:var(--muted)}
.gba-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.gba-cal-cell{min-height:36px;border:1px solid var(--hair);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px 1px;cursor:pointer;position:relative;border-radius:0}
.gba-cal-cell:hover{border-color:var(--ink);background:var(--card2)}
.gba-cal-cell.gba-cal-pad{border:none;background:transparent;cursor:default;pointer-events:none}
.gba-cal-num{font:700 11px var(--font-num);color:var(--ink);line-height:1.1}
.gba-cal-cell.is-sun .gba-cal-num{font-weight:800}
.gba-cal-cell.is-sat .gba-cal-num{color:var(--muted)}
.gba-cal-marks{font-size:9px;line-height:1;display:flex;gap:1px;min-height:9px}
.gba-cal-mark{display:inline-block}
.gba-cal-mark.mark-today{color:var(--ink);font-weight:700}
.gba-cal-mark.mark-school{color:var(--ink);font-weight:700}
.gba-cal-mark.mark-holiday{color:var(--ink)}
.gba-cal-mark.mark-fest{color:var(--muted)}
.gba-cal-cell.is-selected{border:2px solid var(--ink)!important;background:var(--card2);box-shadow:inset 0 0 0 1px var(--ink)}
.gba-cal-cell.is-scene-today{border:2px solid var(--ink);background:var(--card2)}
.gba-cal-cell.has-school{border-top:3px double var(--ink)}
.gba-cal-detail{margin-top:6px}
.gba-cal-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.gba-cal-desc-list{display:flex;flex-direction:column;gap:6px}
.gba-cal-event{border-left:3px solid var(--ink);padding:6px 9px;background:var(--card2);font-size:12px;line-height:1.5}
.gba-cal-event b{display:block;margin-bottom:3px;font-size:12px;color:var(--ink)}
.gba-cal-event p{margin:0;color:var(--ink2);font-size:11.5px}
.gba-badge-today{display:inline-block;padding:1px 6px;font:700 10px var(--font-num);background:var(--ink);color:var(--screen);border:1px solid var(--ink);border-radius:0}
.gba-badge-school{display:inline-block;padding:1px 6px;font:700 10px var(--font-ui);border:2px double var(--ink);background:var(--card2);color:var(--ink);border-radius:0}
.gba-badge-holiday{display:inline-block;padding:1px 6px;font:600 10px var(--font-ui);border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:0}
.gba-badge-fest{display:inline-block;padding:1px 6px;font:600 10px var(--font-ui);border:1px dashed var(--hair);background:var(--card2);color:var(--ink);border-radius:0}

/* 世界书剧情只读标记与原文弹窗 */
.gba-cal-nav{flex-wrap:wrap}
.gba-cal-cell.has-lore{border-bottom:3px double var(--ink)}
.gba-cal-mark.mark-lore{font:700 9px var(--font-ui);white-space:nowrap}
.gba-cal-marks{flex-wrap:wrap;justify-content:center}
.rk-calendar-lore-heading{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rk-calendar-lore-heading button,.rk-calendar-story-button,#rk-calendar-story button{font:12px var(--font-ui);min-height:36px;padding:6px 10px;border:1px solid var(--ink);background:var(--card2);color:var(--ink);cursor:pointer;border-radius:0}
.rk-calendar-lore-heading button:disabled{opacity:.55;cursor:wait}
.rk-calendar-lore-heading button:focus-visible,.rk-calendar-story-button:focus-visible,#rk-calendar-story button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.rk-calendar-lore-note{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.rk-calendar-story-button{display:block;width:100%;text-align:left;margin:6px 0;overflow-wrap:anywhere}
.rk-calendar-story-button small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.rk-calendar-undated summary{cursor:pointer;font-weight:700;padding:8px 0}
.rk-calendar-undated[open]{padding-bottom:8px}
#rk-calendar-story{box-sizing:border-box;width:calc(100% - 24px);max-width:680px;max-height:calc(100% - 24px);margin:auto;padding:14px;border:2px solid var(--ink);border-radius:0;background:var(--card);color:var(--ink);overflow:auto;overscroll-behavior:contain;font:12px/1.65 var(--font-ui)}
#rk-calendar-story::backdrop{background:rgba(0,0,0,.65)}
.rk-calendar-story-header{position:sticky;top:-14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--card);padding:10px 0;border-bottom:1px solid var(--hair);z-index:1}
#rk-calendar-story-title{font:700 14px/1.5 var(--font-title);margin:0;min-width:0;overflow-wrap:anywhere}
.rk-calendar-story-header button{flex-shrink:0}
#rk-calendar-story-source{font-size:11px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
#rk-calendar-story-content{margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font:inherit;color:var(--ink2)}

/* ===== 破军 LIME 互换通讯录样式 ===== */
.lime-contact-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.lime-contact-card{display:flex;align-items:center;cursor:pointer;gap:10px}
.lime-badge-added{display:inline-block;padding:1px 5px;font:700 9px var(--font-ui);border:1px solid var(--ink);background:var(--card2);color:var(--ink);border-radius:0;margin-left:4px}
.lime-badge-unadded{display:inline-block;padding:1px 5px;font:9px var(--font-ui);border:1px dashed var(--hair);background:transparent;color:var(--muted);border-radius:0;margin-left:4px}
.lime-contact-card.muted-card{border-style:dashed;opacity:0.8}
.gba-btn-chat{padding:4px 9px;font:11px var(--font-ui);border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:0;cursor:pointer;white-space:nowrap}
.gba-btn-chat:hover{background:var(--ink);color:var(--screen)}
.gba-btn-action{padding:7px 10px;font:12px var(--font-ui);border:1px solid var(--hair);background:var(--surface);color:var(--ink);text-align:left;border-radius:0;cursor:pointer}
.gba-btn-action:hover{border-color:var(--ink);background:var(--card2)}
.gba-lime-hint{margin-top:8px;padding:8px 10px;background:var(--card2);border-left:3px solid var(--hair);font-size:11.5px;color:var(--ink2);line-height:1.6}
.gba-lime-hint strong{color:var(--ink)}



/* 副 API 表单随手机宽度收拢；长正文、提示词与补丁均留在卡片内。 */
.rk-correction { min-width: 0; }
.rk-correction p { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 8px 0; overflow-wrap: anywhere; }
.rk-correction label { display: grid; min-width: 0; gap: 5px; margin: 10px 0; font-size: 12px; }
.rk-correction input, .rk-correction textarea, .rk-correction select { display: block; width: 100%; min-width: 0; box-sizing: border-box; padding: 9px; border: 1px solid var(--hair); border-radius: 3px; background: var(--card2); color: var(--ink); font: inherit; line-height: 1.5; }
.rk-correction textarea { resize: vertical; }
.rk-correction textarea[readonly] { font-size: 11px; }
.rk-correction-model { display: flex; align-items: end; gap: 8px; }
.rk-correction-model label { flex: 1; }
.rk-correction-model button { flex: none; margin-bottom: 10px; white-space: nowrap; }
.rk-correction-fields { display: grid; grid-template-columns: minmax(0, 1fr) 100px; gap: 10px; }
.rk-correction-fold { margin: 12px 0; padding: 10px; border: 1px solid var(--hair); background: var(--card); }
.rk-correction-fold summary { cursor: pointer; font-size: 12px; font-weight: 600; line-height: 1.6; }
.rk-correction-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.rk-correction button { padding: 8px 10px; background: var(--card2); color: var(--ink); border: 1px solid var(--hair); border-radius: 3px; font: 12px var(--font-ui); line-height: 1.5; cursor: pointer; }
.rk-correction button.rk-correction-primary { background: var(--ink); color: var(--screen); border-color: var(--ink); }
.rk-correction button:disabled { opacity: .45; cursor: default; }
.rk-correction :is(input, textarea, select, button, summary):focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.rk-correction pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; margin: 0; padding: 10px; background: var(--card2); font-size: 11px; line-height: 1.5; }
.rk-correction [data-status] { min-height: 2.4em; }
@media (max-width: 360px) { .rk-correction-fields { grid-template-columns: minmax(0, 1fr) 85px; gap: 8px; } .rk-correction-fold { padding: 8px; } }

/* 自动开关用原生复选框，避免通用输入框样式将它撑满一行。 */
.rk-correction label.rk-correction-auto { display: flex; align-items: center; gap: 8px; }
.rk-correction .rk-correction-auto input { width: 16px; height: 16px; flex: none; margin: 0; padding: 0; accent-color: var(--ink); }
.rk-correction [data-auto-status] { border-left: 2px solid var(--ink); padding-left: 8px; }

/* 七星剑斗祭：沿用终端外壳，赛事大屏在内部独立滚动。 */
.rk-arena-entry{display:flex;flex-direction:column;gap:8px;width:100%;padding:18px;margin-bottom:16px;text-align:left;color:var(--ink);background:var(--card);border:1px solid var(--hair);cursor:pointer}
.rk-arena-entry>span{font-size:16px;font-weight:700}
.rk-arena-entry>small{color:var(--muted);line-height:1.5}
#arena-body{display:flex;flex:1;min-height:0;padding:0;overflow:hidden}
#rk-tournament-frame{display:block;width:100%;height:100%;min-height:0;flex:1;border:0;background:#0a0a0a}


/* Color-block status module. Kept inside the dossier; shell and wheel keep their theme. */
#blazer-body.gba-status {
  --gba-ink: #1b2748;
  --gba-navy: #2b4773;
  --gba-navy-light: #3d608b;
  --gba-paper: #fff3d6;
  --gba-paper-shade: #e9dcb9;
  --gba-muted: #526076;
  --gba-gold: #efbd4f;
  --gba-teal: #319e8e;
  --gba-teal-light: #82d1ad;
  --gba-red: #c85b46;
  --ink: var(--gba-ink);
  --ink2: #35425b;
  --muted: var(--gba-muted);
  --card: var(--gba-paper);
  --card2: var(--gba-paper-shade);
  --hair: #82908f;
  --sky: #205f79;
  --crimson: var(--gba-red);
  --press: var(--gba-paper-shade);
  color: var(--gba-ink);
  background: #223759;
  padding: 2px 0 16px;
  font-size: 13px;
  line-height: 1.65;
  overflow-wrap: anywhere;
  scrollbar-color: var(--gba-gold) var(--gba-ink);
  color-scheme: light;
}

#blazer-body.gba-status *,
#blazer-body.gba-status *::before,
#blazer-body.gba-status *::after {
  box-sizing: border-box;
}

#blazer-body.gba-status .card1 {
  margin: 12px 10px;
  padding: 12px;
  border: 2px solid var(--gba-ink);
  border-radius: 0;
  background: var(--gba-paper);
  color: var(--gba-ink);
  box-shadow: 2px 2px 0 #14203a;
  min-width: 0;
}

#blazer-body.gba-status .ct {
  background: var(--gba-navy);
  color: var(--gba-paper);
  border-bottom: 2px solid var(--gba-gold);
  padding: 6px 9px;
  margin: 12px 0 9px;
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.5;
  letter-spacing: .5px;
}

#blazer-body.gba-status .card1 > .ct:first-child {
  margin: -12px -12px 12px;
}

#blazer-body.gba-status .card-avatar {
  background: var(--gba-gold);
  color: var(--gba-ink);
  border: 2px solid var(--gba-ink);
  box-shadow: none;
}

#blazer-body.gba-status .card-rank-badge {
  display: inline-block;
  vertical-align: middle;
  min-width: 27px;
  margin-left: 3px;
  padding: 2px 5px;
  border: 2px solid var(--gba-ink);
  border-radius: 0;
  background: var(--gba-gold);
  color: var(--gba-ink);
  font: 700 13px/1.3 var(--font-num);
  text-align: center;
  text-shadow: none;
  white-space: nowrap;
}

/* 觉醒是独立布尔状态，使用文字和边框区分，不伪装成等级奖励。 */
#blazer-body.gba-status .gba-awakening {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 10px 0;
  padding: 7px 9px;
  border: 1px solid #82908f;
  background: var(--gba-paper-shade);
  color: var(--gba-muted);
  font-size: 12px;
}

#blazer-body.gba-status .gba-awakening strong {
  color: var(--gba-ink);
  font-weight: 700;
}

#blazer-body.gba-status .gba-awakening[data-awakened='true'] {
  border-left: 4px solid var(--gba-red);
}

/* A navy field keeps the chart distinct from the paper explanation beneath it. */
#blazer-body.gba-status .radar-container {
  background: var(--gba-navy);
  border: 2px solid var(--gba-ink);
  padding: 12px 0;
  min-width: 0;
}

#blazer-body.gba-status .radar-svg {
  display: block;
  width: min(100%, 320px);
  max-height: none;
  height: auto;
  overflow: visible;
}

#blazer-body.gba-status .radar-web,
#blazer-body.gba-status .radar-web-spoke,
#blazer-body.gba-status .radar-spoke {
  stroke: #91abc0;
  stroke-width: 1;
  stroke-opacity: .7;
}

#blazer-body.gba-status .radar-web { fill: none; }

#blazer-body.gba-status .radar-polygon {
  fill: var(--gba-teal);
  fill-opacity: .72;
  stroke: var(--gba-gold);
  stroke-width: 2.2;
  filter: none;
}

#blazer-body.gba-status .radar-point {
  fill: var(--gba-paper);
  stroke: var(--gba-ink);
  stroke-width: 2;
}

#blazer-body.gba-status .radar-label {
  fill: var(--gba-paper);
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 600;
}

#blazer-body.gba-status .radar-rank-badge {
  fill: var(--gba-gold);
  font: 700 12px var(--font-num);
}

#blazer-body.gba-status .radar-legend,
#blazer-body.gba-status .gba-note {
  color: var(--gba-muted);
  font-size: 12px;
  line-height: 1.65;
  margin: 9px 0 0;
}

#blazer-body.gba-status .noble-art-block {
  margin-top: 10px;
  padding: 9px 10px;
  border: 1px solid #a1a58f;
  border-left: 4px solid var(--gba-teal);
  border-radius: 0;
  background: var(--gba-paper-shade);
}

#blazer-body.gba-status .noble-art-title {
  color: var(--gba-ink);
  font: 700 13px/1.6 var(--font-ui);
  flex-wrap: wrap;
}

#blazer-body.gba-status .noble-art-desc {
  color: var(--ink2);
  font-size: 12px;
  line-height: 1.7;
}

/* Native details provides one full-width, keyboard-operable contact control. */
#blazer-body.gba-status .roster-list {
  padding: 10px;
  gap: 12px;
}

#blazer-body.gba-status details.roster-card {
  display: block;
  padding: 0;
  margin: 0;
  border: 2px solid var(--gba-ink);
  border-radius: 0;
  background: var(--gba-paper);
  color: var(--gba-ink);
  box-shadow: 2px 2px 0 #14203a;
  cursor: auto;
  min-width: 0;
}

#blazer-body.gba-status .gba-contact-summary {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 10px;
  min-height: 68px;
  background: var(--gba-navy);
  color: var(--gba-paper);
  list-style: none;
  cursor: pointer;
  touch-action: manipulation;
}

#blazer-body.gba-status .gba-contact-summary::-webkit-details-marker { display: none; }
#blazer-body.gba-status .gba-contact-summary::marker { content: ''; }

#blazer-body.gba-status .gba-contact-summary:hover {
  background: var(--gba-navy-light);
}

#blazer-body.gba-status .gba-contact-summary:focus-visible {
  outline: 3px solid var(--gba-gold);
  outline-offset: -3px;
}

#blazer-body.gba-status .gba-contact[open] > .gba-contact-summary {
  border-bottom: 3px solid var(--gba-gold);
}

#blazer-body.gba-status .roster-ava {
  width: 42px;
  height: 44px;
  flex: 0 0 42px;
  border: 2px solid var(--gba-ink);
  border-radius: 0;
  background: var(--gba-gold);
  color: var(--gba-ink);
  font: 700 24px/1 var(--font-title);
  box-shadow: none;
}

#blazer-body.gba-status .roster-ava.rk-knight-avatar {
  width: 60px;
  height: 80px;
  flex-basis: 60px;
  border: 0;
  background: transparent;
  color: var(--gba-ink);
}

#blazer-body.gba-status .rk-avatar-initial {
  background: var(--gba-gold);
  color: var(--gba-ink);
  border: 2px solid var(--gba-ink);
}

/* 名册标题始终是深蓝色；只提高复用黑色盾边的对比，不改人物色彩。 */
#blazer-body.gba-status .rk-avatar-frame { filter: invert(1); }

#blazer-body.gba-status .roster-info {
  flex: 1 1 auto;
  min-width: 0;
  overflow-wrap: anywhere;
}

#blazer-body.gba-status .roster-name {
  color: inherit;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.7;
}

#blazer-body.gba-status .roster-device {
  color: var(--ink2);
  font-size: 12px;
  line-height: 1.7;
  white-space: normal;
  overflow-wrap: anywhere;
}

#blazer-body.gba-status .gba-contact-summary .roster-device {
  color: #dae6e5;
  margin-top: 3px;
}

#blazer-body.gba-status .gba-disclosure {
  flex: 0 0 auto;
  color: var(--gba-gold);
  font: 700 12px/1.5 var(--font-ui);
  text-align: center;
}

#blazer-body.gba-status .gba-disclosure::before {
  content: '▸';
  display: block;
  font-size: 17px;
  line-height: 1;
}

#blazer-body.gba-status .gba-contact[open] .gba-disclosure::before { content: '▾'; }

#blazer-body.gba-status .gba-contact-body {
  padding: 12px;
  color: var(--gba-ink);
  background: var(--gba-paper);
  min-width: 0;
}

#blazer-body.gba-status .gba-contact-body > .roster-device + .roster-device {
  margin-top: 6px;
}

#blazer-body.gba-status .gba-contact-body dl {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 7px 10px;
  margin: 0;
}

#blazer-body.gba-status .gba-contact-body dt { color: var(--gba-muted); }
#blazer-body.gba-status .gba-contact-body dd { margin: 0; min-width: 0; }

/* Solid meters have a single light edge; neither value is indicated by color alone. */
#blazer-body.gba-status .gba-bond-panel {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 2px solid #bcc1a7;
}

#blazer-body.gba-status .gba-metric {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px 10px;
  color: var(--gba-ink);
  font-size: 12px;
  margin: 9px 0 5px;
}

#blazer-body.gba-status .gba-metric strong,
#blazer-body.gba-status .gba-metric b {
  font: 700 15px/1.4 var(--font-num);
  color: var(--gba-ink);
}

#blazer-body.gba-status .gba-meter {
  height: 16px;
  width: 100%;
  border: 2px solid var(--gba-ink);
  background: #c6c9b2;
  overflow: hidden;
}

#blazer-body.gba-status .gba-meter > span {
  display: block;
  height: 100%;
  min-width: 0;
  max-width: 100%;
  background: var(--gba-teal);
  border-top: 3px solid var(--gba-teal-light);
}

#blazer-body.gba-status .gba-meter[data-kind='support'] > span {
  background: #d59635;
  border-top-color: #ffde83;
}

#blazer-body.gba-status .gba-support-track {
  display: flex;
  gap: 5px;
  margin: 9px 0 0;
  padding: 0;
  list-style: none;
}

#blazer-body.gba-status .gba-support-track li {
  flex: 1 1 0;
  min-width: 0;
  padding: 5px 2px;
  border: 1px solid #8c967f;
  background: var(--gba-paper-shade);
  color: #53616c;
  font: 700 13px/1.5 var(--font-num);
  text-align: center;
}

#blazer-body.gba-status .gba-support-track li[data-achieved='true'] {
  border-color: var(--gba-ink);
  border-bottom: 3px solid var(--gba-gold);
  padding-bottom: 3px;
  background: var(--gba-navy);
  color: var(--gba-paper);
}

#blazer-body.gba-status .gba-support-track small {
  display: block;
  font: 11px/1.4 var(--font-num);
}

#blazer-body.gba-status .gba-unknown {
  color: var(--gba-muted);
  font-size: 12px;
  font-style: normal;
}

#blazer-body.gba-status .gba-romance-panel {
  border-top: 2px solid var(--gba-red);
  margin-top: 14px;
  padding-top: 5px;
}

#blazer-body.gba-status .gba-romance-track {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}

#blazer-body.gba-status .gba-romance-track li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 5px;
  padding: 5px 7px;
  font-family: var(--font-ui);
  font-size: 12px;
}

#blazer-body.gba-status .gba-romance-track li:last-child { grid-column: 1 / -1; }

#blazer-body.gba-status .gba-romance-track li[data-achieved='true'] {
  border-bottom: 1px solid var(--gba-ink);
  border-left: 4px solid var(--gba-red);
  padding-left: 4px;
}

@media (max-width: 350px) {
  #blazer-body.gba-status .card1 { margin: 9px 7px; padding: 10px; }
  #blazer-body.gba-status .card1 > .ct:first-child { margin: -10px -10px 10px; }
  #blazer-body.gba-status .roster-list { padding: 8px 7px; gap: 10px; }
  #blazer-body.gba-status .gba-contact-summary { padding: 9px 8px; gap: 7px; }
  #blazer-body.gba-status .roster-ava { width: 36px; height: 40px; flex-basis: 36px; font-size: 21px; }
  #blazer-body.gba-status .roster-name { font-size: 13px; }
  #blazer-body.gba-status .gba-contact-body { padding: 10px; }
}


/* LIME follows the terminal's shared dark/light palette. */
#scr-lime.rk-lime-screen {
  --rk-lime-paper: var(--surface);
  --rk-lime-list: var(--screen);
  --rk-lime-chat: var(--screen);
  --rk-lime-text: var(--ink);
  --rk-lime-secondary: var(--ink2);
  --rk-lime-muted: var(--muted);
  --rk-lime-line: var(--hair);
  --rk-lime-soft: var(--card2);
  --rk-lime-hover: var(--press);
  --rk-lime-incoming: var(--card2);
  --rk-lime-outgoing: var(--ink);
  --rk-lime-on-outgoing: var(--surface);
  --rk-lime-accent: var(--ink);
  --rk-lime-on-accent: var(--surface);
  --rk-lime-focus: var(--ring);
  color-scheme: inherit;
  color: var(--rk-lime-text);
  background: var(--rk-lime-list);
  font-family: var(--font-ui);
  container-type: inline-size;
}

#scr-lime *, #scr-lime *::before, #scr-lime *::after { box-sizing: border-box; }
#scr-lime [hidden] { display: none !important; }
#scr-lime :is(button, input, textarea) { font-family: inherit; }
#scr-lime button { cursor: pointer; touch-action: manipulation; }
#scr-lime button:disabled { cursor: default; opacity: .55; }
#scr-lime :is(button, summary, input, textarea):focus-visible {
  outline: 2px solid var(--rk-lime-focus);
  outline-offset: 2px;
}

#scr-lime .rk-lime-header {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  flex: none;
  gap: 8px;
  min-height: 64px;
  padding: 6px 10px;
  color: var(--rk-lime-text);
  background: var(--rk-lime-paper);
  border-bottom: 1px solid var(--rk-lime-line);
  box-shadow: none;
}
#scr-lime .rk-lime-header .back,
#scr-lime .rk-lime-profile-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 44px;
  min-width: 44px;
  height: 44px;
  padding: 0;
  color: var(--rk-lime-text);
  background: transparent;
  border: 0;
  border-radius: 12px;
  font-size: 22px;
}
#scr-lime .rk-lime-profile-toggle { width: auto; padding: 0 10px; font-size: 13px; }
#scr-lime .rk-lime-header .back:hover,
#scr-lime .rk-lime-profile-toggle:hover { color: var(--rk-lime-text); background: var(--rk-lime-hover); }
#scr-lime .rk-lime-profile-toggle[aria-expanded="true"] { color: var(--rk-lime-accent); background: var(--rk-lime-soft); }
#scr-lime .rk-lime-heading { display: flex; flex: 1; flex-direction: column; gap: 2px; min-width: 0; }
#scr-lime .rk-lime-heading .t {
  margin: 0;
  font: 700 16px/1.35 var(--font-ui);
  color: var(--rk-lime-text);
  letter-spacing: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#scr-lime .rk-lime-heading .sub {
  margin: 0;
  color: var(--rk-lime-muted);
  font: 11px/1.4 var(--font-ui);
  overflow-wrap: anywhere;
}
#scr-lime #lime-body.rk-lime-body {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  padding: 0;
  background: var(--rk-lime-list);
  overflow: hidden;
}

/* Search and tabs stay visible while the conversation list scrolls. */
#scr-lime .rk-lime-search { flex: none; padding: 12px 16px 8px; background: var(--rk-lime-paper); }
#scr-lime .rk-lime-search input {
  display: block;
  width: 100%;
  height: 44px;
  padding: 0 14px;
  border: 1px solid var(--rk-lime-line);
  border-radius: 12px;
  background: var(--rk-lime-soft);
  color: var(--rk-lime-text);
  font-size: 16px;
  appearance: none;
}
#scr-lime .rk-lime-search input::placeholder { color: var(--rk-lime-muted); opacity: 1; }
#scr-lime .rk-lime-tabs {
  display: flex;
  flex: none;
  gap: 16px;
  padding: 0 16px;
  background: var(--rk-lime-paper);
  border-bottom: 1px solid var(--rk-lime-line);
}
#scr-lime .rk-lime-tabs button {
  position: relative;
  min-width: 44px;
  min-height: 44px;
  padding: 8px 2px;
  border: 0;
  border-bottom: 3px solid transparent;
  background: transparent;
  color: var(--rk-lime-muted);
  font-size: 13px;
  font-weight: 600;
}
#scr-lime .rk-lime-tabs button[aria-selected="true"] { color: var(--rk-lime-accent); border-bottom-color: var(--rk-lime-accent); }
#scr-lime .rk-lime-list {
  flex: 1;
  min-height: 0;
  padding: 4px 0 12px;
  background: var(--rk-lime-paper);
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
#scr-lime .rk-lime-contact {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 84px;
  margin: 0;
  padding: 12px 16px;
  border: 0;
  border-radius: 0;
  background: var(--rk-lime-paper);
  color: var(--rk-lime-text);
  text-align: left;
}
#scr-lime .rk-lime-contact:hover { background: var(--rk-lime-hover); }
#scr-lime .rk-lime-contact:active { background: var(--rk-lime-soft); }
#scr-lime .rk-lime-contact-copy { flex: 1; min-width: 0; }
#scr-lime .rk-lime-contact-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
#scr-lime .rk-lime-contact-name {
  flex: 1;
  min-width: 0;
  color: var(--rk-lime-text);
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#scr-lime .rk-lime-contact-time { flex: none; color: var(--rk-lime-muted); font-size: 10px; white-space: nowrap; }
#scr-lime .rk-lime-contact-last {
  margin-top: 5px;
  color: var(--rk-lime-muted);
  font-size: 12px;
  line-height: 1.6;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Render the original shield artwork whole; these slots never crop it again. */
#scr-lime .rk-lime-contact-avatar { flex: 0 0 44px; width: 44px; height: 58px; }
#scr-lime .rk-lime-message-avatar { flex: 0 0 32px; width: 32px; height: 43px; }
#scr-lime :is(.rk-lime-contact-avatar, .rk-lime-message-avatar) .roster-ava {
  width: 100%;
  height: 100%;
  flex-basis: auto;
  margin: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--rk-lime-text);
  box-shadow: none;
}
#scr-lime :is(.rk-lime-contact-avatar, .rk-lime-message-avatar) .roster-ava:not(.rk-knight-avatar) {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--rk-lime-line);
  border-radius: 8px;
  background: var(--rk-lime-soft);
  font: 700 18px var(--font-ui);
}
#scr-lime .rk-knight-avatar--native .rk-avatar-image { object-fit: contain; clip-path: none; }
#scr-lime .rk-knight-avatar .rk-avatar-initial { background: var(--rk-lime-soft); color: var(--rk-lime-text); border-color: var(--rk-lime-line); font-size: 18px; }

#scr-lime .rk-lime-room {
  display: flex;
  flex: 1;
  flex-direction: column;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  background: var(--rk-lime-chat);
  overflow: hidden;
}
#scr-lime .rk-lime-profile {
  flex: none;
  margin: 0;
  padding: 0 12px;
  border-bottom: 1px solid var(--rk-lime-line);
  background: var(--rk-lime-paper);
  color: var(--rk-lime-text);
  font-size: 12px;
}
#scr-lime .rk-lime-profile > summary { min-height: 44px; padding: 12px 0; cursor: pointer; font-weight: 600; }
#scr-lime .rk-lime-profile[open] { max-height: 34%; overflow-y: auto; overscroll-behavior: contain; }
#scr-lime .rk-lime-profile .lime-chat-profile { gap: 10px; padding: 10px 0; }
#scr-lime .rk-lime-profile .card1 { margin: 8px 0; padding: 10px; border-radius: 10px; border: 1px solid var(--rk-lime-line); box-shadow: none; }
#scr-lime .rk-lime-timeline {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  min-height: 0;
  padding: 16px 14px 20px;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-color: var(--rk-lime-muted) transparent;
  -webkit-overflow-scrolling: touch;
}
#scr-lime .rk-lime-date {
  align-self: center;
  flex: none;
  max-width: 100%;
  margin: 2px 0 4px;
  padding: 4px 11px;
  border-radius: 20px;
  background: var(--rk-lime-accent);
  color: var(--rk-lime-on-accent);
  font-size: 10px;
  line-height: 1.5;
  text-align: center;
  overflow-wrap: anywhere;
}
#scr-lime .rk-lime-message { display: flex; flex: none; align-items: flex-start; gap: 8px; min-width: 0; width: 100%; }
#scr-lime .rk-lime-message-content { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; max-width: calc(100% - 48px); }
#scr-lime .rk-lime-sender { margin: 0 0 4px 2px; color: var(--rk-lime-secondary); font-size: 11px; line-height: 1.4; overflow-wrap: anywhere; }
#scr-lime .rk-lime-bubble {
  position: relative;
  min-width: 0;
  max-width: 100%;
  padding: 10px 13px;
  border: 0;
  border-radius: 16px;
  background: var(--rk-lime-incoming);
  color: var(--rk-lime-text);
  box-shadow: none;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: normal;
}
#scr-lime .rk-lime-message.in .rk-lime-bubble { border-top-left-radius: 5px; }
#scr-lime .rk-lime-bubble::before {
  content: "";
  position: absolute;
  top: 0;
  left: -5px;
  width: 10px;
  height: 12px;
  background: inherit;
  clip-path: polygon(0 0, 100% 0, 100% 100%);
  pointer-events: none;
}
#scr-lime .rk-lime-message.out { justify-content: flex-end; padding-left: 32px; }
#scr-lime .rk-lime-message.out .rk-lime-message-avatar,
#scr-lime .rk-lime-message.out .rk-lime-sender { display: none; }
#scr-lime .rk-lime-message.out .rk-lime-message-content { align-items: flex-end; max-width: 100%; }
#scr-lime .rk-lime-message.out .rk-lime-bubble { background: var(--rk-lime-outgoing); color: var(--rk-lime-on-outgoing); border-top-right-radius: 5px; }
#scr-lime .rk-lime-message.out .rk-lime-bubble::before { left: auto; right: -5px; clip-path: polygon(0 0, 100% 0, 0 100%); }
#scr-lime .rk-lime-message-meta { margin: 4px 2px 0; color: var(--rk-lime-muted); font-size: 10px; line-height: 1.4; overflow-wrap: anywhere; }
#scr-lime .rk-lime-turn-separator {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  gap: 8px;
  margin: 8px 0 2px;
  color: var(--rk-lime-muted);
  font-size: 10px;
  line-height: 1.6;
  text-align: center;
  overflow-wrap: anywhere;
}
#scr-lime .rk-lime-turn-separator::before,
#scr-lime .rk-lime-turn-separator::after { content: ""; flex: 1; height: 1px; background: var(--rk-lime-line); }
#scr-lime .rk-lime-empty { margin: auto; padding: 28px 22px; max-width: 360px; color: var(--rk-lime-secondary); font-size: 13px; line-height: 1.8; text-align: center; overflow-wrap: anywhere; }

#scr-lime .rk-lime-quick-actions {
  display: flex;
  flex: none;
  gap: 6px;
  min-width: 0;
  padding: 6px 10px;
  background: var(--rk-lime-paper);
  border-top: 1px solid var(--rk-lime-line);
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-color: var(--rk-lime-muted) transparent;
}
#scr-lime .rk-lime-quick-actions button {
  flex: none;
  min-width: 44px;
  min-height: 44px;
  padding: 8px 11px;
  border: 1px solid var(--rk-lime-line);
  border-radius: 12px;
  background: var(--rk-lime-paper);
  color: var(--rk-lime-secondary);
  font-size: 12px;
  line-height: 1.4;
  white-space: nowrap;
}
#scr-lime .rk-lime-quick-actions button:hover { border-color: var(--rk-lime-accent); background: var(--rk-lime-hover); }
#scr-lime .rk-lime-composer {
  display: flex;
  flex: none;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 8px;
  padding: 10px 12px 8px;
  background: var(--rk-lime-paper);
  border-top: 1px solid var(--rk-lime-line);
}
#scr-lime #lime-compose {
  display: block;
  flex: 1 1 0;
  width: 0;
  min-width: 0;
  min-height: 44px;
  max-height: 116px;
  margin: 0;
  padding: 9px 12px;
  border: 1px solid var(--rk-lime-line);
  border-radius: 16px;
  background: var(--rk-lime-soft);
  color: var(--rk-lime-text);
  font-size: 16px;
  line-height: 24px;
  resize: none;
  overflow-x: hidden;
  overflow-y: auto;
  overflow-wrap: anywhere;
  appearance: none;
}
#scr-lime #lime-compose::placeholder { color: var(--rk-lime-muted); opacity: 1; }
#scr-lime .rk-lime-send {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  min-width: 48px;
  min-height: 44px;
  padding: 8px 12px;
  border: 0;
  border-radius: 14px;
  background: var(--rk-lime-accent);
  color: var(--rk-lime-on-accent);
  font-size: 13px;
  font-weight: 700;
}
#scr-lime .rk-lime-send:hover:not(:disabled) { background: var(--rk-lime-on-accent); color: var(--rk-lime-accent); box-shadow: inset 0 0 0 1px var(--rk-lime-accent); }
#scr-lime .rk-lime-send .ti { font-size: 19px; }
#scr-lime .rk-lime-send-note {
  flex: none;
  width: 100%;
  margin: 0;
  padding: 0 12px 8px;
  background: var(--rk-lime-paper);
  color: var(--rk-lime-muted);
  font-size: 10px;
  line-height: 1.6;
  text-align: center;
  overflow-wrap: anywhere;
}
#scr-lime .rk-lime-composer .rk-lime-send-note { padding: 0; }
#scr-lime .rk-lime-error {
  flex: none;
  margin: 0;
  padding: 8px 12px;
  border-top: 1px solid var(--rk-lime-line);
  border-left: 3px solid var(--rk-lime-accent);
  background: var(--rk-lime-soft);
  color: var(--rk-lime-text);
  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
#scr-lime .rk-lime-notice {
  flex: none;
  padding: 8px 12px;
  border-top: 1px solid var(--rk-lime-line);
  background: var(--rk-lime-soft);
  color: var(--rk-lime-secondary);
  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

@container (max-width: 360px) {
  #scr-lime .rk-lime-header { gap: 4px; padding-inline: 6px; }
  #scr-lime .rk-lime-profile-toggle { padding-inline: 6px; font-size: 12px; }
  #scr-lime .rk-lime-search { padding-inline: 12px; }
  #scr-lime .rk-lime-contact { gap: 10px; padding-inline: 12px; }
  #scr-lime .rk-lime-timeline { padding-inline: 10px; }
