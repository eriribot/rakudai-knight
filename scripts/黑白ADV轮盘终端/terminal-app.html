:root {
  color-scheme: dark;
  --font-ui: "SF Pro Display", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Yu Gothic UI", "Noto Sans CJK SC", sans-serif;
  --font-num: "SF Pro Text", "Segoe UI", Roboto, tabular-nums;
  --surface: #111520;
  --screen: #0a0d14;
  --card: #161c2b;
  --card2: #1e2638;
  --ink: #f8fafc;
  --ink2: #cbd5e1;
  --muted: #718096;
  --hair: rgba(255, 255, 255, 0.09);
  --ring: rgba(239, 68, 68, 0.35);
  --crimson: #ef4444;
  --crimson-glow: rgba(239, 68, 68, 0.45);
  --hagun-gold: #f59e0b;
  --lime: #10b981;
  --sky: #38bdf8;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.3);
  --press: rgba(255, 255, 255, 0.06);
}

:root[data-rk-theme="light"] {
  color-scheme: light;
  --surface: #f8fafc;
  --screen: #f1f5f9;
  --card: #ffffff;
  --card2: #e2e8f0;
  --ink: #0f172a;
  --ink2: #334155;
  --muted: #64748b;
  --hair: rgba(0, 0, 0, 0.08);
  --ring: rgba(239, 68, 68, 0.3);
  --crimson: #dc2626;
  --crimson-glow: rgba(220, 38, 38, 0.25);
  --hagun-gold: #d97706;
  --lime: #059669;
  --sky: #0284c7;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
  --press: rgba(0, 0, 0, 0.04);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background: var(--screen);
  color: var(--ink);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
}

.num { font-family: var(--font-num); }
button {
  font-family: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  padding: 0;
}

/* 顶栏状态栏 (Hagun Status) */
#sys {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px 6px;
  font-size: 11px;
  color: var(--ink2);
  flex: none;
  background: rgba(10, 13, 20, 0.95);
  border-bottom: 1px solid var(--hair);
  position: relative;
  z-index: 10;
}
#sys .sys-brand {
  font-weight: 800;
  font-size: 10.5px;
  letter-spacing: 0.5px;
  color: var(--crimson);
  display: flex;
  align-items: center;
  gap: 4px;
}
#sys .sys-brand::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--crimson);
  box-shadow: 0 0 8px var(--crimson);
}
#sys .sys-clk {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin-left: auto;
}
#sys .sys-icons {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}

/* 视口堆叠 */
#stack {
  flex: 1;
  position: relative;
  overflow: hidden;
}
.scr {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--screen);
  transform: translateX(100%);
  transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
  pointer-events: none;
  visibility: hidden;
}
.scr.on {
  transform: none;
  pointer-events: auto;
  visibility: visible;
}
.scr.under {
  transform: translateX(-20%);
  opacity: 0.7;
  pointer-events: none;
  visibility: visible;
}
#scr-home { transform: none; pointer-events: auto; visibility: visible; }

.apphead {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  flex: none;
  background: var(--surface);
  border-bottom: 1px solid var(--hair);
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  z-index: 5;
}
.apphead .back {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--ink2);
  border-radius: 8px;
}
.apphead .back:hover { background: var(--press); }
.apphead .t {
  font-weight: 700;
  font-size: 15px;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.apphead .sub {
  font-size: 11px;
  color: var(--muted);
  margin-left: 4px;
}
.apphead .act {
  margin-left: auto;
  font-size: 12.5px;
  color: var(--ink2);
}

.body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  padding-bottom: 12px;
}

/* 底部 Homebar 导航 */
#homebar {
  flex: none;
  display: flex;
  justify-content: center;
  align-items: center;

<!-- 提醒浮条 -->
<div id="toast"></div>

<script>
"use strict";

var bridge = null;
var stat = {};
var currentStack = ['scr-home'];
var blazerSubTab = 'overview';
var activeChat = null;

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('on'); }, 2200);
}

// 导航操作
function openApp(appId) {
  var scrMap = {
    'blazer': 'scr-blazer',
    'lime': 'scr-lime',
    'moments': 'scr-moments',
    'bbs': 'scr-bbs',
    'schedule': 'scr-schedule',
    'gallery': 'scr-gallery',
    'worldbook': 'scr-worldbook',
    'settings': 'scr-settings'
  };
  var target = scrMap[appId];
  if (!target) return;

  if (appId === 'blazer') renderBlazer();
  else if (appId === 'lime') renderLime();
  else if (appId === 'moments') renderMoments();
  else if (appId === 'bbs') renderBbs();
  else if (appId === 'schedule') renderSchedule();
  else if (appId === 'gallery') renderGallery();
  else if (appId === 'worldbook') renderWorldbook();
  else if (appId === 'settings') renderSettings();

  var curEl = document.getElementById(currentStack[currentStack.length - 1]);
  var targetEl = document.getElementById(target);
  if (curEl && targetEl && curEl !== targetEl) {
    curEl.classList.remove('on');
    curEl.classList.add('under');
    targetEl.classList.remove('under');
    targetEl.classList.add('on');
    currentStack.push(target);
  }
}

function goBack() {
  if (currentStack.length <= 1) return;
  var curId = currentStack.pop();
  var curEl = document.getElementById(curId);
  var prevId = currentStack[currentStack.length - 1];
  var prevEl = document.getElementById(prevId);
  if (curEl) {
    curEl.classList.remove('on');
    curEl.classList.remove('under');
  }
  if (prevEl) {
    prevEl.classList.remove('under');
    prevEl.classList.add('on');
  }
}

function goHome() {
  while (currentStack.length > 1) {
    var curId = currentStack.pop();
    var el = document.getElementById(curId);
    if (el) { el.classList.remove('on'); el.classList.remove('under'); }
  }
  var home = document.getElementById('scr-home');
  if (home) { home.classList.remove('under'); home.classList.add('on'); }
  activeChat = null;
}

// ===== 数据解析引擎 (落第骑士 MVU 数据规范) =====
function resolvePlayer() {
  var p = stat && stat.玩家 || {};
  var ability = p.伐刀能力 || {};
  var techniques = ability.招式 || {};
  return {
    name: p.姓名 || '未建档',
    affiliation: p.所属 || '所属未登记',
    rank: p.登记等级 || '—',
    device: p.固有灵装 || '灵装未登记',
    arts: Object.keys(techniques).join('、') || '尚无命名招式',
    bio: p.角色简介 || '完成开局建档后，这里显示本局角色档案。',
    mechanism: ability.能力本质 || '能力本质未登记',
    category: ability.能力系别 || '系别未登记',
    cost: ability.共通限制 || '共通限制未登记',
    style: p.战斗风格 || '战斗风格未登记',
    techniques: techniques,
    otherAbilities: p.其他能力 || {},
    sixAxes: p.六维 || {}
  };
}

function resolveScene() {
  var s = stat && stat.场景 || {};
  return {
    time: s.时间 || '时间未确认',
    location: s.地点 || '地点未确认',
    volume: s.当前卷 === 1 ? '第一卷' : '卷数未确认',
    chapter: s.当前章 || '待选择',
    phase: s.阶段 || '未读取'
  };
}

// 刷新首页学生证
function updateHomeScreen() {
  var pl = resolvePlayer();
  var sc = resolveScene();

  var nameEl = document.getElementById('home-name');
  if (nameEl) nameEl.textContent = pl.name;

  var avaEl = document.getElementById('home-ava');

// ===== 伐刀者档案 (Blazer ID) =====
function switchBlazerTab(tab) {
  blazerSubTab = tab;
  document.querySelectorAll('.subtab').forEach(function(el) {

function rankToValue(r) {
  var m = { 'A': 5.5, 'B': 4.3, 'C': 3.2, 'D': 2.2, 'E': 1.4, 'F': 0.8 };
  return m[String(r).toUpperCase()] || 0;
}

function renderBlazer() {
  var body = document.getElementById('blazer-body');
  if (!body) return;
  var pl = resolvePlayer();
  var sc = resolveScene();

  var headRank = document.getElementById('blazer-head-rank');
  if (headRank) headRank.textContent = pl.rank + '级 伐刀者 // ' + pl.affiliation;

  if (blazerSubTab === 'overview') {
    body.innerHTML = 
      '<div class="card1">' +
        '<div class="ct">破军学园 · 注册学员信息</div>' +
        '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">' +
          '<div class="card-avatar" style="width:54px;height:54px;font-size:22px;">' + esc(pl.name.slice(0, 1)) + '</div>' +
          '<div>' +
            '<div style="font-size:17px;font-weight:800;color:var(--ink);">' + esc(pl.name) + ' <span class="card-rank-badge">' + esc(pl.rank) + '级</span></div>' +
            '<div style="font-size:12px;color:var(--muted);margin-top:2px;">所属：' + esc(pl.affiliation) + '</div>' +
            '<div style="font-size:12px;color:var(--sky);margin-top:2px;">灵装：' + esc(pl.device) + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="font-size:12.5px;color:var(--ink2);line-height:1.6;background:var(--card2);padding:10px 12px;border-radius:10px;">' +
          esc(pl.bio) +
        '</div>' +
      '</div>' +

      '<div class="card1">' +
        '<div class="ct">当前场景</div>' +
        '<div style="font-size:12.5px;color:var(--ink2);line-height:1.6;">' +
          '<div><i class="ti ti-map-pin" style="color:#ef4444;margin-right:4px;"></i> 地点：<b>' + esc(sc.location) + '</b></div>' +
          '<div style="margin-top:4px;"><i class="ti ti-clock" style="color:#38bdf8;margin-right:4px;"></i> 时间：' + esc(sc.time) + '</div>' +
          '<div style="margin-top:4px;"><i class="ti ti-trophy" style="color:#f59e0b;margin-right:4px;"></i> 进度：' + esc(sc.volume + ' · ' + sc.chapter + ' · ' + sc.phase) + '</div>' +
        '</div>' +
      '</div>';
  } else if (blazerSubTab === 'radar') {
    var axesOrder = ['攻击力', '防御力', '魔力量', '魔力控制', '体能', '运气'];
    var cx = 130, cy = 115, maxRadius = 75;
    var points = [];
    var webCircles = [0.25, 0.5, 0.75, 1.0];

    var webSvg = '';
    webCircles.forEach(function(lvl) {
      var r = maxRadius * lvl;
      var pts = [];
      for (var i = 0; i < 6; i++) {
        var angle = (Math.PI / 3) * i - Math.PI / 2;
        pts.push((cx + r * Math.cos(angle)).toFixed(1) + ',' + (cy + r * Math.sin(angle)).toFixed(1));
      }
      webSvg += '<polygon class="radar-web" points="' + pts.join(' ') + '"/>';
    });

    var labelsSvg = '';
    var pointNodes = '';
    for (var i = 0; i < 6; i++) {
      var angle = (Math.PI / 3) * i - Math.PI / 2;
      var spokeX = (cx + maxRadius * Math.cos(angle)).toFixed(1);
      var spokeY = (cy + maxRadius * Math.sin(angle)).toFixed(1);
      webSvg += '<line class="radar-web-spoke" x1="' + cx + '" y1="' + cy + '" x2="' + spokeX + '" y2="' + spokeY + '"/>';

      var axisName = axesOrder[i];
      var rk = pl.sixAxes[axisName] || '—';
      var val = rankToValue(rk);
      var ptR = (val / 6.0) * maxRadius;
      var ptX = cx + ptR * Math.cos(angle);
      var ptY = cy + ptR * Math.sin(angle);
      points.push(ptX.toFixed(1) + ',' + ptY.toFixed(1));
      pointNodes += '<circle class="radar-point" cx="' + ptX.toFixed(1) + '" cy="' + ptY.toFixed(1) + '" r="3.5"/>';

      var labelR = maxRadius + 22;
      var lx = cx + labelR * Math.cos(angle);
      var ly = cy + labelR * Math.sin(angle);
      labelsSvg += '<text class="radar-label" x="' + lx.toFixed(1) + '" y="' + (ly - 6).toFixed(1) + '">' + axisName + '</text>';
      labelsSvg += '<text class="radar-rank-badge" x="' + lx.toFixed(1) + '" y="' + (ly + 7).toFixed(1) + '">' + esc(rk) + '</text>';
    }

    var polygonSvg = '<polygon class="radar-polygon" points="' + points.join(' ') + '"/>';

    body.innerHTML = 
      '<div class="card1">' +
        '<div class="ct">伐刀者 A~F 六维能力雷达评定</div>' +
        '<div class="radar-container">' +
          '<svg class="radar-svg" viewBox="0 0 260 230">' +
            webSvg +
            polygonSvg +
            pointNodes +
            labelsSvg +
          '</svg>' +
        '</div>' +
        '<div style="font-size:12px;color:var(--muted);text-align:center;margin-top:4px;">' +
          '日本伐刀者管理局破军支部 · 六维测定数据' +
        '</div>' +
      '</div>';
  } else if (blazerSubTab === 'device') {
    function listSkills(records) {
      var names = Object.keys(records);
      if (!names.length) return '<div class="noble-art-desc">尚未登记具体能力。</div>';
      return names.map(function(name) {
        var skill = records[name] || {};
        return '<div class="noble-art-block"><div class="noble-art-title">' + esc(name) + ' · ' + esc(skill.掌握状态 || '待确认') + '</div>' +
          '<div class="noble-art-desc">' + esc(skill.说明 || '说明未登记') + '</div>' +
          '<div class="noble-art-desc">条件与代价：' + esc(skill.条件与代价 || '未登记') + '</div></div>';
      }).join('');
    }
    body.innerHTML = '<div class="card1"><div class="ct">固有灵装</div><div class="noble-art-title">' + esc(pl.device) + '</div>' +
      '<div class="ct" style="margin-top:14px;">伐刀能力 · ' + esc(pl.category) + '</div><p>' + esc(pl.mechanism) + '</p>' +
      '<p>共通限制：' + esc(pl.cost) + '</p>' + listSkills(pl.techniques) +
      '<div class="ct" style="margin-top:14px;">其他能力</div>' + listSkills(pl.otherAbilities) + '</div>';
  } else if (blazerSubTab === 'roster') {
    var relations = stat && stat.人际 || {};
    var names = Object.keys(relations);
    body.innerHTML = names.length ? '<div class="roster-list">' + names.map(function(name) {
      var relation = relations[name] || {};
      return '<div class="roster-card"><div class="roster-ava">' + esc(name.slice(0, 1)) + '</div><div class="roster-info">' +
        '<div class="roster-name">' + esc(name) + '</div><div class="roster-device">' + esc(relation.关系 || '关系未确认') + '</div>' +
        '<div class="roster-device">' + esc(relation.态度印象 || '尚无印象记录') + '</div></div></div>';
    }).join('') + '</div>' : '<div class="card1">本局尚无已记录的人际关系。</div>';
  }
}

// 引导启动函数：仅缓存本次显示数据，切换聊天或读取失败时清空。
var bridgeRevision = 0;
function refreshTerminalView() {
  updateHomeScreen();
  var renderers = { 'scr-blazer': renderBlazer, 'scr-lime': renderLime, 'scr-moments': renderMoments, 'scr-bbs': renderBbs, 'scr-schedule': renderSchedule };
  var render = renderers[currentStack[currentStack.length - 1]];
  if (render) render();
}
function refreshTerminalState() {
  var revision = ++bridgeRevision;
  stat = {};
  refreshTerminalView();
  if (!bridge || typeof bridge.getStat !== 'function') return Promise.resolve();
  return Promise.resolve().then(function() { return bridge.getStat(); }).then(function(value) {
    if (revision !== bridgeRevision) return;
    stat = value || {};
    refreshTerminalView();
  }).catch(function() {
    if (revision !== bridgeRevision) return;
    stat = {};
    refreshTerminalView();
  });
}
window.RKBoot = function(b) {
  bridge = b;
  refreshTerminalState();
  if (bridge && typeof bridge.onUpdate === 'function') bridge.onUpdate(refreshTerminalState);
};

// 默认首屏就绪
updateHomeScreen();

<script>

/* MONO ADV controls: menu keyboard operation and UI-only status badge. */
(function () {
  var root = document.querySelector('.home-content');
  document.querySelectorAll('[data-layout-choice]').forEach(function (button) {
    button.addEventListener('click', function () {
      var layout = button.getAttribute('data-layout-choice');
      root.setAttribute('data-layout', layout);
      document.querySelectorAll('[data-layout-choice]').forEach(function (b) {
        b.setAttribute('aria-pressed', b === button ? 'true' : 'false');
      });
    });
  });
  var items = Array.from(document.querySelectorAll('.mono-sector'));
  items.forEach(function (item, index) {
    function setLabel() {
      document.getElementById('mono-wheel-label').textContent = item.getAttribute('data-label');
      items.forEach(function (it) { it.setAttribute('tabindex', it === item ? '0' : '-1'); });
    }
    item.addEventListener('pointerenter', setLabel);
    item.addEventListener('focus', setLabel);
    item.addEventListener('keydown', function (e) {
      var next = index;
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault(); openApp(item.getAttribute('data-app')); return;
      }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (index + 1) % items.length;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (index + items.length - 1) % items.length;
      else if (e.key === 'Home') next = 0;
      else if (e.key === 'End') next = items.length - 1;
      else return;
      e.preventDefault(); items[next].focus();
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (currentStack.length > 1) goBack();
      else if (bridge && bridge.ui) bridge.ui.close();
    }
  });
  var originalUpdate = updateHomeScreen;
  updateHomeScreen = function () {
    originalUpdate();
    var badge = document.getElementById('mono-source');
    if (badge) {
      var hasRecord = stat && (stat.玩家 || stat.player || stat.user);
      badge.textContent = hasRecord ? 'MVU / 读取' : '原稿示例';
      badge.title = hasRecord ? '已读取原有玩家字段；缺失字段仍沿用原稿回退值。' : '未读到原脚本支持的玩家字段；当前显示原稿内置示例。';
    }
  };
  updateHomeScreen();
})();

</script>
