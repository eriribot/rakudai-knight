<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>六花终端 · 学战应用</title>
  <link rel="stylesheet" href="./terminal-asterisk.css">
</head>
<body>
  <svg class="ax-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="ax-home" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m12 8 3.5 2v4L12 16l-3.5-2v-4L12 8Z"/></symbol>
    <symbol id="ax-blazer" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3M4 3H2v5m18-5h2v5"/></symbol>
    <symbol id="ax-lime" viewBox="0 0 24 24"><path d="M3 4h18v13H10l-5 4v-4H3ZM7 9h10M7 13h7"/></symbol>
    <symbol id="ax-moments" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m12 2 3 5 6 1-3 5 1 6-7-1-6 3-1-7-3-5 6-2 4-5Z"/></symbol>
    <symbol id="ax-bbs" viewBox="0 0 24 24"><path d="M3 3h14v12H3Zm5 16h9l4 3V8M6 7h8M6 11h5"/></symbol>
    <symbol id="ax-schedule" viewBox="0 0 24 24"><path d="M7 3h10v7a5 5 0 0 1-10 0ZM7 5H3v4a4 4 0 0 0 5 4m9-8h4v4a4 4 0 0 1-5 4M12 15v6m-5 0h10"/></symbol>
    <symbol id="ax-gallery" viewBox="0 0 24 24"><path d="M3 3h18v18H3ZM3 17l6-7 5 5 3-4 4 5"/><circle cx="16" cy="7" r="1"/></symbol>
    <symbol id="ax-calendar" viewBox="0 0 24 24"><path d="M4 5h16v16H4ZM4 10h16M8 2v6m8-6v6M8 14h2m4 0h2m-8 3h2"/></symbol>
    <symbol id="ax-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></symbol>
    <symbol id="ax-back" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
    <symbol id="ax-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="ax-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="ax-star" viewBox="0 0 24 24"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/></symbol>
  </svg>
  <div class="ax-shell">
    <header class="ax-system"><span class="ax-system-brand">ASTERISK <i>/</i> 六花终端</span><span id="ax-source-status" role="status">等待读取</span></header>
    <div class="ax-appbar"><button class="ax-icon-button" id="ax-back-button" data-action="home" aria-label="返回终端总览"><svg class="ax-icon"><use href="#ax-back"/></svg></button><div class="ax-appbar-title"><span id="ax-page-code">PERSONAL INTERFACE</span><h1 id="ax-page-title">终端总览</h1></div><button class="ax-icon-button" data-action="close" aria-label="收起终端，返回轮盘入口"><svg class="ax-icon"><use href="#ax-close"/></svg></button></div>
    <main class="ax-viewport" id="ax-viewport" tabindex="-1"><div class="ax-data-message" id="ax-data-message" role="status" hidden></div><div id="ax-content"></div></main>
    <nav class="ax-dock" aria-label="终端快捷导航"><button data-app="home" aria-current="page"><svg class="ax-icon"><use href="#ax-home"/></svg><span>总览</span></button><button data-app="blazer"><svg class="ax-icon"><use href="#ax-blazer"/></svg><span>学生档案</span></button><button data-action="close"><svg class="ax-icon"><use href="#ax-back"/></svg><span>返回轮盘</span></button></nav>
  </div>
  <dialog class="ax-dialog" id="ax-dialog" aria-labelledby="ax-dialog-title"><div class="ax-dialog-heading"><h2 id="ax-dialog-title"></h2><button class="ax-icon-button" data-action="dismiss" aria-label="关闭详情"><svg class="ax-icon"><use href="#ax-close"/></svg></button></div><div id="ax-dialog-body"></div></dialog>
  <div class="ax-toast" id="ax-toast" role="status" aria-live="polite"></div>
  <script src="./terminal-asterisk.js"></script>
</body>
</html>
