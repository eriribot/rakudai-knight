<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《学战都市Asterisk》小说插图画廊</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --badge-cover: #ef4444;
      --badge-color: #8b5cf6;
      --badge-bw: #64748b;
      --badge-other: #475569;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Sidebar */
    aside {
      width: 320px;
      min-width: 320px;
      background: #111827;
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--card-border);
    }
    .sidebar-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .sidebar-header p {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .vol-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .vol-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      margin-bottom: 4px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.88rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    .vol-btn:hover {
      background: var(--card-bg);
      border-color: var(--card-border);
    }
    .vol-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .vol-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--card-border);
      color: var(--text-muted);
    }
    /* Main Content */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .topbar {
      padding: 16px 24px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
    }
    .topbar-info h2 {
      font-size: 1.2rem;
      font-weight: 700;
    }
    .filter-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.84rem;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }
    /* Grid */
    .gallery-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border-color: var(--accent);
    }
    .img-wrap {
      width: 100%;
      height: 280px;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.3s;
    }
    .card:hover .img-wrap img {
      transform: scale(1.05);
    }
    .card-info {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cat-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }
    .cat-封面, .cat-封底 { background: var(--badge-cover); color: #fff; }
    .cat-彩插 { background: var(--badge-color); color: #fff; }
    .cat-黑白插图 { background: var(--badge-bw); color: #fff; }
    .cat-图标装饰 { background: var(--badge-other); color: #cbd5e1; }
    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .modal-img {
      max-width: 90vw;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .modal-caption {
      margin-top: 12px;
      font-size: 0.95rem;
      color: #e2e8f0;
      text-align: center;
    }
    .modal-close {
      position: absolute;
      top: -36px;
      right: 0;
      font-size: 28px;
      color: #cbd5e1;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover {
      color: #fff;
    }
  </style>
</head>

 20, "size": 20200}, {"filename": "t1.png", "rel_path": "学战都市Asterisk 17 六花团圆/t1.png", "category": "图标装饰", "width": 533, "height": 176, "size": 32504}]}];
    let currentVolIndex = -1; // -1 means all
    let currentCategory = 'all';

    const volList = document.getElementById('volList');
    const galleryGrid = document.getElementById('galleryGrid');
    const currentVolTitle = document.getElementById('currentVolTitle');

    // Build sidebar
    function renderSidebar() {
      const allBtn = document.createElement('button');
      allBtn.className = 'vol-btn active';
      allBtn.innerHTML = `<span>全部卷插图</span><span class="vol-badge">${data.reduce((acc, v) => acc + v.images.length, 0)}</span>`;
      allBtn.onclick = () => selectVolume(-1, allBtn);
      volList.appendChild(allBtn);

      data.forEach((v, idx) => {
        const btn = document.createElement('button');
        btn.className = 'vol-btn';
        btn.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:6px;" title="${v.volume}">${v.volume}</span><span class="vol-badge">${v.images.length}</span>`;
        btn.onclick = () => selectVolume(idx, btn);
        volList.appendChild(btn);
      });
    }

    function selectVolume(idx, btnElement) {
      currentVolIndex = idx;
      document.querySelectorAll('.vol-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      if (idx === -1) {
        currentVolTitle.textContent = '全部卷总览 (16 卷合计)';
      } else {
        currentVolTitle.textContent = data[idx].volume + ` (${data[idx].size_str})`;
      }
      renderGallery();
    }

    // Filter tabs
    document.querySelectorAll('.tab-btn').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCategory = tab.dataset.cat;
        renderGallery();
      };
    });

    function getFilteredImages() {
      let imgs = [];
      if (currentVolIndex === -1) {
        data.forEach(v => imgs.push(...v.images));
      } else {
        imgs = [...data[currentVolIndex].images];
      }

      // Update counters
      const allCount = imgs.length;
      const coverCount = imgs.filter(i => i.category === '封面' || i.category === '封底').length;
      const colorCount = imgs.filter(i => i.category === '彩插').length;
      const bwCount = imgs.filter(i => i.category === '黑白插图').length;

      document.getElementById('countAll').textContent = allCount;
      document.getElementById('countCover').textContent = coverCount;
      document.getElementById('countColor').textContent = colorCount;
      document.getElementById('countBw').textContent = bwCount;

      if (currentCategory === 'all') return imgs;
      if (currentCategory === '封面/封底') {
        return imgs.filter(i => i.category === '封面' || i.category === '封底');
      }
      return imgs.filter(i => i.category === currentCategory);
    }

    function renderGallery() {
      const imgs = getFilteredImages();
      galleryGrid.innerHTML = '';

      imgs.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(item);

        const kb = (item.size / 1024).toFixed(1) + ' KB';
        card.innerHTML = `
          <div class="img-wrap">
            <img src="${encodeURI(item.rel_path)}" loading="lazy" alt="${item.filename}">
          </div>
          <div class="card-info">
            <div class="card-top">
              <span class="card-title" title="${item.rel_path}">${item.filename}</span>
              <span class="cat-badge cat-${item.category}">${item.category}</span>
            </div>
            <div class="card-meta">
              <span>${item.width} × ${item.height}</span>
              <span>${kb}</span>
            </div>
          </div>
        `;
        galleryGrid.appendChild(card);
      });
    }

    function openModal(item) {
      const modal = document.getElementById('imageModal');
      const img = document.getElementById('modalImg');
      const caption = document.getElementById('modalCaption');
      img.src = encodeURI(item.rel_path);
      caption.innerHTML = `<strong>${item.rel_path}</strong> · [${item.category}] ${item.width}×${item.height} · ${(item.size/1024).toFixed(1)} KB`;
      modal.classList.add('active');
    }

    function closeModal(e) {
      if (e.target.id === 'imageModal') {
        document.getElementById('imageModal').classList.remove('active');
      }
    }
    function closeModalDirect() {
      document.getElementById('imageModal').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModalDirect();
    });

    renderSidebar();
    renderGallery();
  </script>
</body>
</html>
