    summary: "尤莉丝跃下四楼施展『九轮舞焰花』试探身手，自报序列第五名号并触摸『赤莲』校徽发起决斗；围观学生科普《在名祭祀书》(72人)与《始页十二人》(12人)；夜吹英士郎从人群抛借普通剑型煌式武装，尤莉丝拔出『花冠旋剑』，决斗正式成立。"
