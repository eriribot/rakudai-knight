    sceneId: CH-01-S04
    title: "『锐枪白炎花』远程封杀与『天雾辰明流·贰蛟龙』切裂爆炎"
    summary: "尤莉丝拉开距离以『锐枪白炎花』及强化版『六瓣爆焰花』贴脸引爆；绫斗发动流星斗技（过剩万应现象）配合『天雾辰明流剑术初段──贰蛟龙』将火焰十字切开，伴随体内封印松动的薄光火花高速冲入尤莉丝怀中。"
    source: "第一卷_01_第一章_华焰魔女.md#L519-L665"
