<p class="episode">静矢との一戦後、選抜戦で順調に勝ち星を重ねる一輝。その強さに惹かれ、いつしか一輝の下には、剣術の教えを乞おうとする日下部加々美を始めとした生徒達が集うようになっていた。一方、一輝との仲が一向に進展しないステラは、日々苛立ちを募らせる。ある日、一輝が稽古のため皆とプールに行くと知り、ステラも無理矢理ついていく事に。</p>
