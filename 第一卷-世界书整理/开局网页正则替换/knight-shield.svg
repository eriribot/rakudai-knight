<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 115" width="100%" height="100%">
  <defs>
    <!-- 赤红渐变与金色描边滤镜 -->
    <linearGradient id="shieldBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="60%" stop-color="#f8f1e3"/>
      <stop offset="100%" stop-color="#eedfc8"/>
    </linearGradient>
    <linearGradient id="shieldCrestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a31d1d"/>
      <stop offset="50%" stop-color="#8b1e1e"/>
      <stop offset="100%" stop-color="#6e1313"/>
    </linearGradient>
    <filter id="shieldShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3d1414" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 盾牌外廓与外描边 -->
  <path d="M 50 12 
           C 60 14, 76 10, 87 7 
           C 89 25, 91 48, 83 66 
           C 74 85, 60 97, 50 106 
           C 40 97, 26 85, 17 66 
           C 9 48, 11 25, 13 7 
           C 24 10, 40 14, 50 12 Z" 
        fill="url(#shieldBgGrad)" 
        stroke="#8b1e1e" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="url(#shieldShadow)"/>

  <!-- 盾牌内圈金色细线装饰 -->
  <path d="M 50 18 
           C 58 19.5, 72 16, 81 14 
           C 83 29, 85 49, 78 63 
           C 70 79, 58 90, 50 97 
           C 42 90, 30 79, 22 63 
           C 15 49, 17 29, 19 14 
           C 28 16, 42 19.5, 50 18 Z" 
        fill="none" 
        stroke="#c5a059" 
        stroke-width="1.8" 
        stroke-opacity="0.75" 
        stroke-linejoin="round"/>

  <!-- 内部骑士双翼鹿角十字纹章 -->
  <g fill="url(#shieldCrestGrad)">
    <!-- 上方左侧鹿角/双翼分支 -->
    <path d="M 50 48 
             C 48 39, 41 28, 30 24 
             C 31 29, 33 33, 37 36 
             C 33 34, 27 35, 25 38 
             C 29 40, 34 40, 39 42 
             C 42 44, 46 46, 50 48 Z"/>
    <path d="M 32 26 
             C 33 21, 37 17, 39 15 
             C 38 19, 37 23, 36 27 Z"/>

    <!-- 上方右侧鹿角/双翼分支 (对称镜像) -->
    <path d="M 50 48 
             C 52 39, 59 28, 70 24 
             C 69 29, 67 33, 63 36 
             C 67 34, 73 35, 75 38 
             C 71 40, 66 40, 61 42 
             C 58 44, 54 46, 50 48 Z"/>
    <path d="M 68 26 
             C 67 21, 63 17, 61 15 
             C 62 19, 63 23, 64 27 Z"/>

    <!-- 中部横向十字骨与端点圆钮 -->
    <circle cx="22" cy="54" r="3.8" />
    <circle cx="78" cy="54" r="3.8" />
    <path d="M 24 52 
             C 34 51, 44 50, 50 50 
             C 56 50, 66 51, 76 52 
             C 76 56, 66 55, 50 55 
             C 34 55, 24 56, 24 52 Z"/>

    <!-- 下方倒王冠与剑尖几何纹 -->
    <path d="M 50 52 L 42 62 C 45 63, 48 64, 50 61 C 52 64, 55 63, 58 62 Z"/>
    <path d="M 36 61 
             L 42 74 
             L 47 70 
             L 50 75 
             L 53 70 
             L 58 74 
             L 64 61 
             C 60 66, 56 68, 53 65 
             L 50 68 
             L 47 65 
             C 44 68, 40 66, 36 61 Z"/>
             
    <!-- 底端锐利终点菱形剑芒 -->
    <polygon points="50,78 47,83 50,89 53,83"/>
  </g>
</svg>