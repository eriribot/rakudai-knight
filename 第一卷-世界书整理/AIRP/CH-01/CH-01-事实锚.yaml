negativeConstraints:
  - id: NC-CH01-001
    rule: "不得把一辉的 F 级或低魔力写成不会战斗；剑术、体术、观察与解析能力必须与能力值缺陷并存"
    enforcement: reject
    source: ["FA-CH01-005", "FA-CH01-013", "FA-CH01-019"]
  - id: NC-CH01-002
    rule: "不得把幻想型态模拟战改写为实像形态、现实斩杀或永久肉体伤害"
    enforcement: reject
    source: ["FA-CH01-011", "FA-CH01-018"]
  - id: NC-CH01-003
    rule: "不得把一刀修罗写成无冷却、无代价、可中途停止或可连续使用"
    enforcement: reject
    source: ["FA-CH01-015", "FA-CH01-017"]
  - id: NC-CH01-004
    rule: "黑乃向史黛菈披露的内幕必须保留知识渠道，不得自动扩散给一辉、观众、黑铁家或全校"
    enforcement: reject
    source: ["FA-CH01-022", "FA-CH01-028"]
  - id: NC-CH01-005
    rule: "父亲和黑铁龙马的台词属于 memory_quoted，不得写成第一章当前时在场角色"
    enforcement: reject
    source: ["FA-CH01-021", "MAT-001#L1,707", "MAT-001#L1,749"]
  - id: NC-CH01-006
    rule: "第一章末关系最多到室友、尊重、好奇和价值观互认，不得提前提交终章恋爱、月下告白或七星剑王决胜战约定"
    enforcement: reject
    source: ["FA-CH01-024", "FA-CH01-025"]
  - id: NC-CH01-007
    rule: "不得把主仆赌约扩写为无边界现实强制、违法或性命令；命令范围必须经过双方明确同意"
    enforcement: reject
    source: ["FA-CH01-025", "MAT-001#L1,817-L1,929"]
  - id: NC-CH01-008
    rule: "不得把准备去超市写成已经抵达、不得读取 L2,021 之后内容作为第一章效果"
    enforcement: reject
    source: ["FA-CH01-027", "FA-CH01-029"]
  - id: NC-CH01-009
    rule: "L1,445-L1,657 的接触事件只保留好奇、越界、意外跌落和包扎功能，不扩写性化细节"
    enforcement: reject
    source: ["MAT-001#L1,445-L1,657"]

